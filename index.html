<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04070F">
<title>Token</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link href="assets/fx/token-fx.css?v=15.2" rel="stylesheet">
<style>
:root{
  --void:#04070F; --deep:#070D1A;
  --glass:rgba(12,26,46,.64); --glass2:rgba(16,34,58,.5);
  --edge:rgba(88,190,255,.24); --edge-soft:rgba(88,190,255,.12); --edge-hot:rgba(120,220,255,.72);
  --cy:#3FC7FF; --cy-hi:#A8EEFF; --gold:#FFD37A; --red:#FF5C79; --grn:#4BE38F;
  --fg:#DCEEF8; --dim:#93AEC2; --faint:#6B869A;
  --dsp:'Orbitron',sans-serif; --ui:'Rajdhani',sans-serif; --tc:'Noto Sans TC',sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--void);color:var(--fg);font-family:var(--tc);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(880px 520px at 50% -10%,rgba(63,199,255,.17),transparent 62%),
    radial-gradient(620px 460px at 100% 30%,rgba(63,199,255,.06),transparent 60%),
    radial-gradient(560px 420px at 0% 85%,rgba(63,199,255,.05),transparent 62%);
}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}

/* ---------- 共用 ---------- */
.mark{display:inline-flex;align-items:baseline;gap:8px;font-family:var(--dsp);font-weight:800;letter-spacing:.14em;color:var(--fg)}
.mark .t{text-shadow:0 0 28px rgba(63,199,255,.55)}
.mark .v{font-weight:700;font-size:.42em;letter-spacing:.08em;color:var(--cy);text-shadow:0 0 14px rgba(63,199,255,.8)}

.btn{
  position:relative;display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;min-height:52px;padding:0 18px;border-radius:4px;
  font-family:var(--tc);font-weight:700;font-size:15px;letter-spacing:.12em;color:#04121C;
  background:linear-gradient(135deg,var(--cy-hi),var(--cy) 55%,#1FA5DE);
  box-shadow:0 8px 28px rgba(63,199,255,.28),inset 0 1px 0 rgba(255,255,255,.55);
  transition:transform .1s,opacity .2s,filter .2s;
}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.38;filter:saturate(.4);cursor:default}
.btn.ghost{background:rgba(63,199,255,.07);color:var(--cy-hi);border:1px solid var(--edge);box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#FF9AAE,var(--red) 55%,#D1284A);color:#1C0309;box-shadow:0 8px 28px rgba(255,92,121,.26)}
.btn.busy{color:transparent!important;pointer-events:none}
.btn.busy::after{
  content:'';position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;
  border-radius:50%;border:2px solid rgba(4,18,28,.25);border-top-color:#04121C;animation:spin .7s linear infinite;
}
.btn.ghost.busy::after{border-color:rgba(168,238,255,.2);border-top-color:var(--cy-hi)}
@keyframes spin{to{transform:rotate(360deg)}}

.fld{margin-bottom:14px}
.fld label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:7px;letter-spacing:.06em}
/* v13：表單裡的勾選欄 */
.fld label.chk{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--fg);margin-bottom:4px;cursor:pointer}
.fld label.chk input[type=checkbox]{width:20px;height:20px;flex:0 0 20px;margin:0;accent-color:var(--cy)}
.fld input{
  width:100%;height:50px;padding:0 14px;border-radius:4px;font-size:16px;
  background:rgba(3,8,18,.72);border:1px solid var(--edge);color:var(--fg);
  transition:border-color .15s,box-shadow .15s;
}
.fld input::placeholder{color:#4A6275}
.fld input:focus{outline:none;border-color:var(--edge-hot);box-shadow:0 0 0 3px rgba(63,199,255,.12)}
.fld .help{font-size:12px;color:var(--faint);margin-top:6px}

/* ---------- 啟動畫面 ---------- */
.boot{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:var(--void)}
.boot .mark{font-size:34px;animation:breathe 1.8s ease-in-out infinite}
.boot-bar{width:120px;height:2px;border-radius:2px;background:var(--edge-soft);overflow:hidden;position:relative}
.boot-bar::after{content:'';position:absolute;top:0;bottom:0;width:40%;background:var(--cy);box-shadow:0 0 10px var(--cy);animation:slide 1.1s ease-in-out infinite}
.boot-msg{font-size:13px;color:var(--faint);min-height:20px;text-align:center;padding:0 24px}
@keyframes breathe{50%{opacity:.55}}
@keyframes slide{from{left:-40%}to{left:100%}}

/* ---------- 登入 ---------- */
.gate{position:relative;z-index:1;min-height:100%;display:flex;justify-content:center;padding:calc(64px + var(--safe-t)) 22px calc(40px + var(--safe-b))}
.gate-in{width:100%;max-width:380px}
.gate .mark{font-size:40px}
.gate-lead{margin:30px 0 14px;color:var(--dim);font-size:14px;letter-spacing:.06em}

.pid{position:relative;display:flex;gap:14px;cursor:text}
.pid input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;caret-color:transparent;z-index:2}
.cell{
  position:relative;flex:1;height:116px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--ui);font-weight:700;font-size:74px;color:var(--cy-hi);
  background:linear-gradient(170deg,rgba(14,30,52,.75),rgba(4,10,20,.78));
  border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 rgba(168,238,255,.1);
  transition:border-color .18s,box-shadow .18s;
}
.cell.fill{text-shadow:0 0 22px rgba(63,199,255,.8),0 0 4px rgba(168,238,255,.9)}
.pid.focus .cell.cur{border-color:var(--edge-hot);box-shadow:0 0 0 1px rgba(120,220,255,.35),0 0 30px rgba(63,199,255,.22),inset 0 1px 0 rgba(168,238,255,.14)}
.pid.focus .cell.cur::after{content:'';position:absolute;left:30%;right:30%;bottom:22px;height:3px;border-radius:2px;background:var(--cy);box-shadow:0 0 10px var(--cy);animation:blink 1s steps(1) infinite}
.pid.ok .cell{border-color:rgba(120,220,255,.5)}
@keyframes blink{50%{opacity:0}}

.gate-status{min-height:48px;display:flex;align-items:center;margin:16px 0 6px;font-size:14px;color:var(--dim);line-height:1.6}
.gate-status.warn{color:#FFB3C1}
.who{display:flex;align-items:center;gap:12px}
.who b{font-size:17px;color:var(--fg)}
.who span{color:var(--faint);font-size:13px}

.reveal{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.reveal.on{grid-template-rows:1fr}
.reveal>div{overflow:hidden;visibility:hidden;transition:visibility 0s .28s}
.reveal.on>div{visibility:visible;transition:none}
.reveal .pad{padding-top:10px}
.gate-foot{margin-top:28px;text-align:center;font-size:12px;color:#4A6275}

/* ---------- 六角頭像 ---------- */
.hex{position:relative;flex:none;display:flex;align-items:center;justify-content:center}
.hex svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hex .ch{position:relative;font-weight:700;color:var(--cy-hi);line-height:1}

/* ---------- 主框架 ---------- */
.app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}
.top{
  position:sticky;top:0;z-index:5;
  padding:calc(12px + var(--safe-t)) 18px 12px;
  background:linear-gradient(180deg,rgba(4,7,15,.94),rgba(4,7,15,.78));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--edge-soft);
}
.top-in{max-width:488px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.top .mark{font-size:18px}
.top-me{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--dim)}
.top-me b{font-family:var(--ui);font-weight:700;font-size:15px;color:var(--cy-hi);letter-spacing:.04em}

.views{flex:1;width:100%;max-width:520px;margin:0 auto;padding:18px 16px calc(96px + var(--safe-b))}
.view{animation:viewIn .22s ease-out}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}}

.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;
  padding-bottom:var(--safe-b);background:rgba(5,10,20,.94);border-top:1px solid var(--edge-soft);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.tabs-in{display:flex;width:100%;max-width:520px}
.tab{flex:1;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--faint);position:relative;transition:color .18s}
.tab svg{width:22px;height:22px}
.tab span{font-size:11px;letter-spacing:.12em}
.tab.on{color:var(--cy-hi)}
.tab.on svg{filter:drop-shadow(0 0 8px rgba(63,199,255,.85))}
.tab.on::before{content:'';position:absolute;top:-1px;left:32%;right:32%;height:2px;background:var(--cy);box-shadow:0 0 12px var(--cy)}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 10px}
.sec-h h2{font-size:15px;font-weight:700;letter-spacing:.08em}
.sec-h span{font-size:12px;color:var(--faint)}

/* ---------- 玩家卡 ---------- */
.idcard{
  position:relative;overflow:hidden;border-radius:8px;padding:22px 20px 0;
  background:
    radial-gradient(420px 220px at 100% 0%,rgba(63,199,255,.16),transparent 70%),
    linear-gradient(160deg,var(--glass),var(--glass2));
  border:1px solid var(--edge);
  box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(168,238,255,.12);
}
.idcard::before{content:'';position:absolute;left:12%;right:12%;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--edge-hot),transparent)}
.idcard::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 38%,rgba(168,238,255,.16) 50%,transparent 62%);
  background-size:260% 100%;animation:sheen 7s ease-in-out infinite;
}
@keyframes sheen{0%,72%{background-position:150% 0}100%{background-position:-60% 0}}
.id-row{display:flex;align-items:center;gap:16px}
.id-name{min-width:0}
.id-name h1{font-size:24px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.id-meta{display:flex;align-items:center;gap:8px;margin-top:4px}
.id-no{font-family:var(--ui);font-weight:700;font-size:16px;color:var(--cy);letter-spacing:.06em}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:3px;font-size:11px;font-weight:700;letter-spacing:.08em}
.tag.gold{color:#2A1A00;background:linear-gradient(135deg,#FFE7B0,var(--gold));box-shadow:0 0 12px rgba(255,211,122,.35)}
.tag.cy{color:var(--cy-hi);background:rgba(63,199,255,.1);border:1px solid var(--edge)}
.tag.warn{color:#FFD5A0;background:rgba(255,190,90,.08);border:1px solid rgba(255,190,90,.3)}
.id-stats{display:grid;grid-template-columns:repeat(3,1fr);margin:20px -20px 0;border-top:1px solid var(--edge-soft)}
.id-stats div{padding:13px 4px 14px;text-align:center}
.id-stats div+div{border-left:1px solid var(--edge-soft)}
.id-stats b{display:block;font-family:var(--ui);font-weight:700;font-size:26px;line-height:1.15;color:var(--gold);text-shadow:0 0 16px rgba(255,211,122,.35)}
.id-stats span{font-size:11.5px;color:var(--faint);letter-spacing:.06em}

/* ---------- 本季 ---------- */
.season{
  border-radius:8px;padding:18px 20px;
  background:linear-gradient(160deg,var(--glass),var(--glass2));border:1px solid var(--edge);
}
.season-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.season-left small{display:block;font-size:12px;color:var(--faint)}
.season-cd{font-family:var(--dsp);font-weight:700;font-size:28px;line-height:1.2;color:var(--cy-hi);text-shadow:0 0 20px rgba(63,199,255,.45);white-space:nowrap}
.season-cd em{font-style:normal;font-family:var(--tc);font-size:13px;font-weight:500;color:var(--dim);margin:0 8px 0 3px;text-shadow:none}
.season-wk{font-weight:700;font-size:14px;color:var(--dim);text-align:right;white-space:nowrap}
.season-wk small{display:block;font-family:var(--tc);font-weight:400;font-size:12px;color:var(--faint);letter-spacing:0}
.track{position:relative;height:4px;margin-top:16px;border-radius:2px;background:rgba(63,199,255,.1)}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,#1FA5DE,var(--cy));box-shadow:0 0 12px rgba(63,199,255,.6)}
.days{display:grid;grid-template-columns:repeat(7,1fr);margin-top:8px;font-size:11px;color:var(--faint);text-align:center}
.days span.now{color:var(--cy-hi);font-weight:700}

/* ---------- 遊戲入口 ---------- */
.game{
  position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;
  border-radius:8px;padding:18px;min-height:104px;
  background:linear-gradient(135deg,rgba(18,40,66,.7),rgba(8,16,30,.8));border:1px solid var(--edge);
}
.game-suit{
  flex:none;width:64px;height:64px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:38px;color:var(--cy-hi);background:rgba(63,199,255,.08);border:1px solid var(--edge);
  text-shadow:0 0 20px rgba(63,199,255,.7);
}
.game-txt{flex:1;min-width:0}
.game-txt h3{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700}
.game-txt p{font-size:13px;color:var(--faint);margin-top:2px}
.game-bg{position:absolute;right:-18px;bottom:-40px;font-size:150px;line-height:1;color:rgba(63,199,255,.05);pointer-events:none}

/* ---------- 列表群組 ---------- */
.grp{border-radius:8px;overflow:hidden;background:linear-gradient(160deg,var(--glass),var(--glass2));border:1px solid var(--edge)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 16px;text-align:left;border-bottom:1px solid var(--edge-soft)}
.row:last-child{border-bottom:0}
button.row:active{background:rgba(63,199,255,.06)}
.row .k{flex:1;min-width:0}
.row .k small{display:block;font-size:12px;color:var(--faint);line-height:1.5;margin-top:1px}
.row .v{color:var(--dim);font-family:var(--ui);font-weight:600;font-size:15px}
.row .chev{color:var(--faint);font-size:18px;line-height:1}
.row.red .k{color:var(--red)}
.pl-name{display:flex;align-items:center;gap:8px;min-width:0}
.pl-name b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-no{font-family:var(--ui);font-weight:700;font-size:16px;color:var(--cy);letter-spacing:.04em;flex:none;width:26px}

.switch{position:relative;flex:none;width:52px;height:30px;border-radius:15px;background:rgba(120,150,175,.22);border:1px solid var(--edge-soft);transition:background .2s,border-color .2s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#C9D9E5;transition:transform .22s cubic-bezier(.3,1.4,.5,1),background .2s}
.switch[aria-checked=true]{background:rgba(63,199,255,.35);border-color:var(--edge-hot)}
.switch[aria-checked=true]::after{transform:translateX(22px);background:var(--cy-hi);box-shadow:0 0 12px var(--cy)}
.switch:disabled{opacity:.5}

.empty{padding:26px 16px;text-align:center;font-size:13px;color:var(--faint)}

/* ---------- 底部面板 ---------- */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(1,3,8,.66);opacity:0;transition:opacity .2s}
.sheet-bg.on{opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;margin:0 auto;max-width:520px;
  padding:10px 20px calc(22px + var(--safe-b));border-radius:14px 14px 0 0;
  background:linear-gradient(180deg,#0D1C31,#070F1D);border:1px solid var(--edge);border-bottom:0;
  box-shadow:0 -20px 60px rgba(0,0,0,.6);transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.9,.3,1);
  max-height:88vh;overflow-y:auto;
}
.sheet.on{transform:none}
.sheet-grip{width:40px;height:4px;border-radius:2px;background:rgba(140,180,210,.3);margin:0 auto 14px}
.sheet h3{font-size:18px;font-weight:700;margin-bottom:6px}
.sheet .desc{font-size:13.5px;color:var(--dim);margin-bottom:18px}
.sheet .acts{display:flex;gap:10px;margin-top:6px}
.sheet .acts .btn{flex:1}

/* ---------- 提示 ---------- */
.toast{
  position:fixed;left:50%;top:calc(66px + var(--safe-t));z-index:60;transform:translate(-50%,-10px);
  max-width:calc(100vw - 32px);width:max-content;padding:12px 18px;border-radius:6px;
  font-size:14px;text-align:center;background:rgba(11,24,42,.97);border:1px solid var(--edge);
  box-shadow:0 14px 40px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:rgba(255,92,121,.55);color:#FFC7D1}
.toast.good{border-color:rgba(75,227,143,.45);color:#C8F7DB}
.gate-mode .toast{top:calc(18px + var(--safe-t))}


/* ---------- 本季資產 ---------- */
.money{font-family:var(--ui);font-weight:700;color:var(--gold);letter-spacing:.01em;text-shadow:0 0 6px rgba(255,211,122,.5),0 0 30px rgba(255,211,122,.26)}
.asset{
  border-radius:8px;padding:18px 20px 16px;
  background:radial-gradient(420px 220px at 0% 0%,rgba(255,211,122,.08),transparent 70%),linear-gradient(160deg,var(--glass),var(--glass2));
  border:1px solid var(--edge);
}
.asset-top{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--faint)}
.rank{color:var(--faint)}
.rank b{font-family:var(--ui);font-weight:700;font-size:17px;color:var(--cy-hi);margin:0 1px}
.asset .money{font-size:50px;line-height:1.08;margin-top:2px}
.breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.breakdown div{min-width:0;padding:8px 10px 9px;border-radius:5px;background:rgba(3,8,18,.5);border:1px solid var(--edge-soft)}
.breakdown span{display:block;font-size:11.5px;color:var(--faint)}
.breakdown b{display:block;font-family:var(--ui);font-weight:700;font-size:18px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.breakdown b.debt{color:#FF8FA3}
.breakdown b.gold{color:var(--gold)}
.sheet-bd{grid-template-columns:repeat(2,1fr);margin:0 0 14px}
.asset-foot{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;margin-top:16px;font-size:12.5px;color:var(--faint)}
.asset-foot b{font-family:var(--ui);font-weight:700;font-size:15px;color:var(--cy-hi);margin-left:4px}
.asset .track{margin-top:10px}

.skel{min-height:190px}
.skel-line{height:12px;border-radius:3px;margin-bottom:14px;background:linear-gradient(90deg,rgba(63,199,255,.06),rgba(63,199,255,.14),rgba(63,199,255,.06));background-size:200% 100%;animation:shimmer 1.3s linear infinite}
.skel-line.w40{width:40%}.skel-line.w70{width:70%}.skel-line.big{height:46px;width:60%;margin:14px 0 22px}
@keyframes shimmer{to{background-position:-200% 0}}

.btn.sm{flex:none;width:auto;min-height:42px;padding:0 18px;font-size:14px;letter-spacing:.06em}
.task-entry{margin-top:12px}

/* ---------- 銀行 ---------- */
.lbl{font-size:12.5px;color:var(--faint)}
.vault{
  position:relative;overflow:hidden;border-radius:8px;padding:20px;
  background:radial-gradient(440px 240px at 100% 0%,rgba(63,199,255,.16),transparent 70%),linear-gradient(160deg,var(--glass),var(--glass2));
  border:1px solid var(--edge);box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(168,238,255,.12);
}
.vault::before{content:'';position:absolute;left:12%;right:12%;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--edge-hot),transparent)}
.vault .bal{font-family:var(--ui);font-weight:700;font-size:50px;line-height:1.08;color:var(--cy-hi);text-shadow:0 0 28px rgba(63,199,255,.5)}
.rate-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:28px;padding:3px 11px;border-radius:14px;font-size:12.5px;color:var(--dim);background:rgba(3,8,18,.5);border:1px solid var(--edge-soft)}
.chip b{font-family:var(--ui);font-weight:700;font-size:14.5px;color:var(--cy-hi)}
.vault-next{display:flex;align-items:flex-end;justify-content:space-between;margin-top:18px;padding-top:14px;border-top:1px solid var(--edge-soft);min-height:60px}
.vault-next small{display:block;font-size:12px;color:var(--faint)}
.vault-next .cd{font-family:var(--ui);font-weight:700;font-size:24px;color:var(--fg);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.vault-next .est{font-family:var(--ui);font-weight:700;font-size:24px;color:var(--grn);text-align:right}
.vault-next div:last-child small{text-align:right}
.two{display:flex;gap:10px;margin-top:16px}
.two .btn{flex:1}
.note-s{font-size:12.5px;color:var(--faint);margin-top:12px;line-height:1.65}

.loan{
  border-radius:8px;padding:18px 20px 20px;
  background:linear-gradient(160deg,var(--glass),var(--glass2));border:1px solid var(--edge);
}
.loan.owe{border-color:rgba(255,92,121,.36);background:radial-gradient(380px 200px at 100% 0%,rgba(255,92,121,.1),transparent 70%),linear-gradient(160deg,var(--glass),var(--glass2))}
.loan-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.loan .owed{font-family:var(--ui);font-weight:700;font-size:36px;line-height:1.1;color:var(--fg)}
.loan.owe .owed{color:#FF8FA3;text-shadow:0 0 22px rgba(255,92,121,.35)}
.loan .count{font-size:13px;color:var(--dim);padding-bottom:5px;white-space:nowrap}
.loan p{font-size:13px;color:var(--dim);margin:10px 0 16px;line-height:1.65}

/* ---------- 名單、流水帳、表單 ---------- */
.pl-net{font-family:var(--ui);font-weight:700;font-size:15px;color:var(--gold)}
.pl-net.debt{color:#FF8FA3}
.led .row{align-items:flex-start}
.led .amt{flex:none;text-align:right;font-family:var(--ui);font-weight:700;font-size:16px;line-height:1.3}
.led .amt small{display:block;font-family:var(--tc);font-weight:400;font-size:11.5px;color:var(--faint)}
.led .amt.up{color:var(--grn)}
.led .amt.dn{color:#FF8FA3}
.led .amt.mv{color:var(--dim)}
.amt-in{font-family:var(--ui)!important;font-weight:700;font-size:24px!important;color:var(--gold)!important;letter-spacing:.02em}
.limit{font-size:12.5px;color:var(--faint);margin:-6px 0 12px}
.quick{display:flex;gap:8px;margin:0 0 16px}
.quick button{flex:1;height:38px;border-radius:5px;font-family:var(--ui);font-weight:700;font-size:15px;color:var(--cy-hi);border:1px solid var(--edge);background:rgba(63,199,255,.06)}
.quick button:active{background:rgba(63,199,255,.16)}
.fld-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fld-grid .fld input{height:46px}
.fld-grid label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 德州 ---------- */
.pk-mode .views{padding-top:8px;padding-bottom:calc(66px + var(--safe-b))}
.pk{display:flex;flex-direction:column;min-height:420px}
.felt{
  position:relative;flex:1;min-height:0;margin:4px 2px 0;border-radius:46%/34%;
  background:radial-gradient(ellipse at 50% 42%,rgba(63,199,255,.13),transparent 58%),radial-gradient(ellipse at 50% 48%,#0C2038,#070E1E 64%,#04070F);
  border:1px solid var(--edge);
  box-shadow:inset 0 0 90px rgba(0,0,0,.7),inset 0 0 44px rgba(63,199,255,.09),0 0 60px rgba(63,199,255,.1);
}
.felt::before{content:'';position:absolute;inset:14px;border-radius:46%/34%;border:1px solid rgba(63,199,255,.1);pointer-events:none}
.pk-center{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:66%;text-align:center;z-index:2;pointer-events:none}
.board{display:flex;justify-content:center;gap:4px;margin-bottom:8px}
.pc{
  position:relative;width:clamp(30px,8.4vw,40px);height:clamp(42px,11.6vw,56px);border-radius:5px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  background:linear-gradient(165deg,#F4F8FB,#CFDCE6);color:#0B1622;
  box-shadow:0 3px 10px rgba(0,0,0,.5),inset 0 1px 0 #fff;animation:flip .32s cubic-bezier(.2,1.4,.4,1) backwards;
}
.pc b{font-family:var(--ui);font-weight:700;font-size:clamp(14px,4vw,19px)}
.pc i{font-style:normal;font-size:clamp(12px,3.4vw,16px);margin-top:1px}
.pc.red{color:#D3172F}
.pc.slot{background:rgba(4,10,20,.35);border:1px dashed rgba(88,190,255,.22);box-shadow:none;animation:none}
.pc.mini{width:24px;height:33px;border-radius:3px}
.pc.mini b{font-size:12px}.pc.mini i{font-size:10px}
@keyframes flip{from{transform:rotateY(90deg) scale(.8);opacity:0}}
.pot-l{font-size:11px;color:var(--faint);letter-spacing:.2em}
.pot{font-family:var(--ui);font-weight:700;font-size:clamp(28px,9vw,40px);line-height:1.05;color:var(--gold);text-shadow:0 0 6px rgba(255,211,122,.7),0 0 26px rgba(255,211,122,.35)}
.pk-status{margin-top:6px;font-size:12.5px;color:var(--dim);line-height:1.55;min-height:20px}
.pk-status b{font-family:var(--ui);font-size:15px;color:var(--cy-hi)}

.seat{position:absolute;transform:translate(-50%,-50%);text-align:center;z-index:3}
.seat .sc{
  position:relative;padding:6px 3px 5px;border-radius:5px;
  background:linear-gradient(160deg,#0F2036,#07101D);border:1px solid var(--edge);
  box-shadow:0 4px 14px rgba(0,0,0,.45);transition:transform .2s,box-shadow .2s,border-color .2s;
}
.felt.short .pk-center{top:37%;width:60%}
.felt.short .board .pc{width:26px;height:36px}
.felt.short .board .pc b{font-size:13px}.felt.short .board .pc i{font-size:11px}
.felt.short .pot{font-size:24px}
.felt.short .pk-status{font-size:11.5px;margin-top:3px}
.seat.vacant{width:26px;height:26px;padding:0;border-radius:50%;border:1px dashed rgba(88,190,255,.28);background:rgba(4,10,20,.3);z-index:1;cursor:default}
.seat.me .sc{border-color:rgba(75,227,143,.5)}
.seat.dim{opacity:.42}
.seat.turn{z-index:5}
.seat.turn .sc{transform:scale(1.08);border-color:var(--edge-hot);animation:glow 1.6s ease-in-out infinite}
.seat.win .sc{border-color:rgba(255,211,122,.8);box-shadow:0 0 26px rgba(255,211,122,.45)}
@keyframes glow{0%,100%{box-shadow:0 0 0 1px rgba(120,220,255,.35),0 0 20px rgba(63,199,255,.35)}50%{box-shadow:0 0 0 1px rgba(120,220,255,.7),0 0 36px rgba(63,199,255,.7)}}
.seat .nm{font-size:11.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .stk{font-family:var(--ui);font-weight:700;font-size:14px;color:var(--gold);line-height:1.2}
.seat .sst{font-size:10px;color:var(--faint);line-height:1.3}
.seat .sst.hot{font-family:var(--ui);font-weight:700;color:var(--red);letter-spacing:.08em}
.seat .dealer{position:absolute;top:-8px;left:-6px;z-index:2;width:19px;height:19px;border-radius:50%;font-family:var(--ui);font-weight:700;font-size:11px;line-height:19px;color:#0B1622;background:#F4F8FB;box-shadow:0 0 10px rgba(255,255,255,.5)}
.seat .bet{display:inline-block;margin-top:4px;padding:1px 9px;border-radius:12px;font-family:var(--ui);font-weight:700;font-size:12px;color:#1A1204;background:linear-gradient(135deg,#FFE6AE,var(--gold));box-shadow:0 0 12px rgba(255,211,122,.55)}
.seat .shown{display:flex;justify-content:center;gap:2px;margin-top:4px}
.seat .hn{font-size:10px;color:var(--grn);white-space:nowrap}
.seat .won{font-family:var(--ui);font-weight:700;font-size:13px;color:var(--gold);text-shadow:0 0 10px rgba(255,211,122,.7)}

.pk-mine{display:flex;align-items:center;justify-content:center;gap:6px;min-height:6px;padding-top:8px}
.pk-mine .lbl{margin-right:4px;letter-spacing:.12em}
.pk-mine .pc{width:44px;height:62px}
.pk-mine .pc b{font-size:21px}.pk-mine .pc i{font-size:17px}
.pk-bar{padding:10px 2px 2px}
.pk-hint{text-align:center;font-size:13px;line-height:22px;min-height:22px;color:var(--cy-hi);letter-spacing:.1em;margin-bottom:8px}
.pk-hint b{font-family:var(--ui);font-size:17px;color:var(--gold)}
.pk-hint.urgent b{color:var(--red)}
.act-row{display:flex;gap:8px}
.act-row .btn{flex:1;min-height:54px;padding:0 4px;letter-spacing:.04em;font-size:15px}
.pk-wait,.pk-note{text-align:center;font-size:13px;color:var(--faint);padding:4px 0 10px}
.mini-row,.adm-row{display:flex;justify-content:center;gap:8px}
.adm-row{margin-top:8px}
.mini{min-height:36px;padding:0 14px;border-radius:18px;font-size:13px;color:var(--cy-hi);border:1px solid var(--edge);background:rgba(63,199,255,.06)}
.mini.red{color:#FF8FA3;border-color:rgba(255,92,121,.36);background:rgba(255,92,121,.06)}
.mini:disabled{opacity:.4}
.pk{position:relative}
.pk-raise{
  position:absolute;left:0;right:0;bottom:var(--bar-h,120px);z-index:9;padding:12px 12px 10px;border-radius:10px;
  background:linear-gradient(180deg,rgba(13,28,49,.97),rgba(7,15,29,.98));border:1px solid var(--edge);
  box-shadow:0 -12px 40px rgba(0,0,0,.55);animation:viewIn .18s ease-out;
}
.pk-raise-top{display:flex;gap:8px;align-items:center}
.pk-raise-top input{flex:1;min-width:0;height:46px;padding:0 12px;border-radius:5px;text-align:center;background:rgba(3,8,18,.72);border:1px solid rgba(255,211,122,.35)}
.pk-raise input[type=range]{width:100%;accent-color:var(--cy);height:30px;margin:6px 0 4px}
.pk-raise .quick{margin-bottom:0}
button.game{width:100%;text-align:left;cursor:pointer}
button.game:active{transform:scale(.99)}
.game .chev{color:var(--faint);font-size:22px;position:relative}
.tag.live{color:#03170B;background:linear-gradient(135deg,#B5F7D0,var(--grn));box-shadow:0 0 12px rgba(75,227,143,.4)}
.sel{width:100%;height:50px;padding:0 12px;border-radius:4px;font-size:15px;color:var(--fg);background:rgba(3,8,18,.72);border:1px solid var(--edge)}
@media (max-height:700px){ .pk-mine .pc{width:36px;height:50px} .act-row .btn{min-height:48px} }

/* ---------- 排行榜 ---------- */
.seg{display:flex;padding:4px;border-radius:9px;background:rgba(3,8,18,.6);border:1px solid var(--edge-soft)}
.seg button{flex:1;height:38px;border-radius:6px;font-size:14px;font-weight:500;color:var(--faint);letter-spacing:.1em;transition:background .18s,color .18s}
.seg button.on{color:#04121C;font-weight:700;background:linear-gradient(135deg,var(--cy-hi),var(--cy));box-shadow:0 4px 16px rgba(63,199,255,.3)}
.rk-note{font-size:12.5px;color:var(--faint);margin:12px 2px 4px;line-height:1.7}
.rk-empty{margin-top:14px;border-radius:8px;border:1px dashed var(--edge-soft)}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin:18px 0 14px}
.pod{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.pod.empty{visibility:hidden}
.pod-top{position:relative;margin-bottom:6px}
.medal{position:absolute;right:-4px;bottom:-2px;width:22px;height:22px;border-radius:50%;font-family:var(--ui);font-weight:700;font-size:13px;line-height:22px;color:#1A1204}
.pod.p1 .medal{background:linear-gradient(135deg,#FFF0C4,var(--gold));box-shadow:0 0 14px rgba(255,211,122,.7)}
.pod.p2 .medal{background:linear-gradient(135deg,#F2F7FB,#A9BCCB)}
.pod.p3 .medal{background:linear-gradient(135deg,#F3C99A,#B27A45)}
.pod-name{max-width:100%;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod-val{font-family:var(--ui);font-weight:700;font-size:18px;color:var(--gold);line-height:1.25}
.pod.p1 .pod-val{font-size:22px;text-shadow:0 0 18px rgba(255,211,122,.45)}
.pod-sub{font-size:11px;color:var(--faint)}
.pod-base{width:100%;margin-top:8px;border-radius:6px 6px 0 0;border:1px solid var(--edge);border-bottom:0;background:linear-gradient(180deg,rgba(63,199,255,.14),rgba(63,199,255,.02))}
.pod.p1 .pod-base{height:58px;border-color:rgba(255,211,122,.45);background:linear-gradient(180deg,rgba(255,211,122,.2),rgba(255,211,122,.02))}
.pod.p2 .pod-base{height:40px}
.pod.p3 .pod-base{height:28px}
.pod.me .pod-name{color:var(--grn)}
.rk-list .row{min-height:52px}
.rk-list .row.me{background:rgba(75,227,143,.07)}
.rk-no{flex:none;width:26px;text-align:center;font-family:var(--ui);font-weight:700;font-size:16px;color:var(--cy)}
.rk-no.none{color:var(--faint)}
.rk-val{flex:none;text-align:right;line-height:1.25}
.rk-val b{font-family:var(--ui);font-weight:700;font-size:16px;color:var(--gold)}
.rk-val small{display:block;font-size:11px;color:var(--faint)}
.lock-note{margin-top:12px;padding:8px 10px;border-radius:5px;font-size:12.5px;color:#FFD5A0;background:rgba(255,190,90,.08);border:1px solid rgba(255,190,90,.3)}
.tab span{letter-spacing:.06em}

/* ---------- 頭像三層 ---------- */
.pav{position:relative;flex:none;display:inline-block;vertical-align:middle}
.pav svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pav .pav-frame{filter:drop-shadow(0 0 3px var(--fc))}
.pav.anim .pav-frame{animation:frameGlow 2.2s ease-in-out infinite}
@keyframes frameGlow{0%,100%{filter:drop-shadow(0 0 2px var(--fc))}50%{filter:drop-shadow(0 0 9px var(--fc))}}
.pav-crown{position:absolute;left:50%;top:-18%;transform:translateX(-50%);font-size:clamp(9px,32%,22px);color:#FFD37A;text-shadow:0 0 8px rgba(255,211,122,.9);line-height:1}
.idcard{cursor:pointer}
.idcard.has-bg{background:linear-gradient(180deg,rgba(4,7,15,.35),rgba(4,7,15,.82)),var(--card-bg)}
.tag.star{color:var(--gold);background:rgba(255,211,122,.1);border:1px solid rgba(255,211,122,.3);font-family:var(--ui);font-size:13px}
.id-meta{flex-wrap:wrap}

/* ---------- 個人頁 ---------- */
.prof,.closet-hero{position:relative;overflow:hidden;margin:-2px -4px 6px;border-radius:10px;padding:22px 16px 18px;background:radial-gradient(420px 220px at 50% 0%,rgba(63,199,255,.2),transparent 70%),linear-gradient(160deg,#10223A,#060C18);border:1px solid var(--edge)}
.prof-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,7,15,.05),rgba(4,7,15,.55))}
.prof-in{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center}
.prof-name{margin-top:10px;font-size:21px;font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.prof-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:4px}
.stat-h{margin:16px 2px 8px;font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--dim)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.st-cell{min-width:0;padding:8px 8px 9px;border-radius:6px;background:rgba(3,8,18,.55);border:1px solid var(--edge-soft)}
.st-cell span{display:block;font-size:11px;color:var(--faint)}
.st-cell b{display:block;font-family:var(--ui);font-weight:700;font-size:17px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-cell b.gold{color:var(--gold)}.st-cell b.up{color:var(--grn)}.st-cell b.dn{color:#FF8FA3}
.rk-list .row{gap:10px}
.pod{cursor:pointer}
.rk-list .row[data-prof]{cursor:pointer}

/* ---------- 商店、衣櫃 ---------- */
.me-sub{margin-top:14px}
.stars-card{display:flex;align-items:center;gap:14px;border-radius:8px;padding:14px 16px;background:radial-gradient(360px 180px at 0% 0%,rgba(255,211,122,.12),transparent 70%),linear-gradient(160deg,var(--glass),var(--glass2));border:1px solid rgba(255,211,122,.3)}
.stars-card p{flex:1;font-size:12.5px;color:var(--faint);text-align:right}
.stars-val{font-family:var(--ui);font-weight:700;font-size:30px;line-height:1.1;color:var(--gold);text-shadow:0 0 20px rgba(255,211,122,.4)}
.shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shop-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;border-radius:8px;background:linear-gradient(160deg,var(--glass),var(--glass2));border:1px solid var(--edge);min-width:0}
.shop-card:active{transform:scale(.98)}
.shop-card.owned{opacity:.6}
.shop-prev{height:64px;display:flex;align-items:center;justify-content:center}
.shop-name{font-size:13px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop-price{font-family:var(--ui);font-weight:700;font-size:15px;color:var(--gold);line-height:1.2;text-align:center}
.shop-price small{display:block;font-family:var(--tc);font-weight:400;font-size:10.5px;color:var(--faint)}
.shop-price.own{font-family:var(--tc);font-size:12px;color:var(--grn)}
.bg-swatch{border-radius:8px;border:1px solid var(--edge);box-shadow:inset 0 0 20px rgba(0,0,0,.35)}
.bg-swatch.def{background:linear-gradient(160deg,#10223A,#060C18)}
.em-swatch{display:flex;align-items:center;justify-content:center;border-radius:14px;font-size:15px;font-weight:700;color:var(--fg);background:rgba(63,199,255,.1);border:1px solid var(--edge);padding:4px;text-align:center;line-height:1.2}
.em-swatch.card{font-size:28px;color:var(--cy-hi)}
.buy-prev{display:flex;flex-direction:column;align-items:center;gap:10px;margin:4px 0 18px}
.em-list{font-size:14px;color:var(--dim)}
.closet-hero{margin:0 0 4px}
.closet-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.closet-row::-webkit-scrollbar{display:none}
.closet-item{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;border-radius:8px;background:rgba(3,8,18,.5);border:1px solid var(--edge-soft)}
.closet-item span{font-size:11.5px;color:var(--dim);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.closet-item.on{border-color:var(--edge-hot);background:rgba(63,199,255,.1);box-shadow:0 0 16px rgba(63,199,255,.2)}
.closet-item.on span{color:var(--cy-hi);font-weight:700}
.closet-item.effect{width:124px}
.closet-item.effect span{white-space:normal;line-height:1.25;min-height:29px;text-align:center}
.closet-empty{flex:none;min-width:190px;display:flex;align-items:center;justify-content:center;padding:12px 16px;border-radius:8px;border:1px dashed var(--edge-soft);color:var(--faint);font-size:12px;background:rgba(3,8,18,.28)}
.row:disabled{opacity:.5}

/* ---------- 表情 ---------- */
.em-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.em-grid button{height:54px;border-radius:8px;font-size:26px;background:rgba(3,8,18,.55);border:1px solid var(--edge-soft)}
.em-grid button.txt{font-size:14px;font-weight:700;color:var(--fg)}
.em-grid button:active{background:rgba(63,199,255,.16)}
#pkBubbles{position:absolute;inset:0;pointer-events:none;z-index:8}
.bubble{position:absolute;transform:translate(-50%,-100%);padding:4px 10px;border-radius:14px;font-size:22px;line-height:1.2;white-space:nowrap;background:rgba(244,248,251,.96);color:#0B1622;box-shadow:0 6px 18px rgba(0,0,0,.45);animation:pop 2.8s ease-out forwards}
.bubble.txt{font-size:13px;font-weight:700}
.bubble::after{content:'';position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:rgba(244,248,251,.96);border-bottom:0}
@keyframes pop{0%{transform:translate(-50%,-80%) scale(.4);opacity:0}10%{transform:translate(-50%,-100%) scale(1.08);opacity:1}18%{transform:translate(-50%,-100%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-120%);opacity:0}}
.pk-hint-row{position:relative}
.pk-hint-row .em-btn{position:absolute;right:0;top:-6px;min-height:32px;padding:0 10px;font-size:16px}

/* ---------- 座位頭像 ---------- */
.seat{cursor:pointer}
.seat .sc{padding-top:17px;margin-top:15px}
.seat-av{position:absolute;left:50%;top:-15px;transform:translateX(-50%);line-height:0}
.seat .dealer{top:6px}

/* ---------- v6：頭像、橫幅、卡背、商店、包包、信箱 ---------- */
.pav{position:relative;flex:none;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;vertical-align:middle;
  background:linear-gradient(145deg,#1A3A5E,#081322);border:1.5px solid rgba(120,220,255,.55);box-shadow:0 4px 14px rgba(0,0,0,.45)}
.pav img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.pav-ch{font-weight:700;color:#A8EEFF;text-shadow:0 0 12px rgba(63,199,255,.7);line-height:1}
.pav.t1{border-color:rgba(168,238,255,.6)}
.pav.t2{border:2px solid #FFD37A;box-shadow:0 0 16px rgba(255,211,122,.45),0 4px 14px rgba(0,0,0,.45)}
/* 四階（終焉神域／荷官）改成白色光環，原本的粉紅太跳 */
.pav.t4{border:2px solid #FFFFFF;box-shadow:0 0 20px rgba(255,255,255,.55),0 4px 14px rgba(0,0,0,.45);animation:godGlow 2.4s ease-in-out infinite}
@keyframes godGlow{50%{box-shadow:0 0 34px rgba(255,255,255,.85),0 4px 14px rgba(0,0,0,.45)}}
.pav-crown,.pav svg{display:none}

.banner{position:relative;width:100%;aspect-ratio:3/1;border-radius:10px 10px 0 0;background-size:cover;background-position:center;overflow:hidden}
.banner.def{background:radial-gradient(40% 70% at 50% 50%,rgba(63,199,255,.22),transparent 70%),linear-gradient(160deg,#10223A,#060C18)}
.banner::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,7,15,0) 55%,rgba(4,7,15,.55))}
.banner-av{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1;line-height:0}
.idcard{padding:0}
.idcard .id-row{padding:12px 18px 0;justify-content:center;text-align:center}
.idcard .id-name{display:flex;flex-direction:column;align-items:center}
.idcard .id-meta{justify-content:center}
.idcard .id-stats{margin:14px 0 0}
.id-no.vanity{color:var(--gold);text-shadow:0 0 12px rgba(255,211,122,.5)}
.sheet.flush{padding-top:10px}
.sheet.flush .banner{border-radius:10px}
.prof-id{text-align:center;margin-top:8px}
.prof-name{font-size:21px;font-weight:700}
.prof-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:4px}

.backs{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);display:flex;gap:2px;z-index:0;pointer-events:none}
.cb{width:15px;height:22px;border-radius:2px;background-size:cover;background-position:center;border:1px solid rgba(255,255,255,.55);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.cb.b2{transform:rotate(10deg) translateX(-3px)}
.cb.def{background:repeating-linear-gradient(45deg,#1B3A60 0 3px,#0B1B30 3px 6px);border-color:rgba(120,220,255,.55)}
.seat .backs + .sc{}

.chips{display:flex;gap:6px;overflow-x:auto;margin:14px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:34px;padding:0 14px;border-radius:17px;font-size:13.5px;color:var(--dim);border:1px solid var(--edge-soft);background:rgba(3,8,18,.5)}
.chips button.on{color:#04121C;font-weight:700;background:linear-gradient(135deg,var(--cy-hi),var(--cy));border-color:transparent}
.chips.small{margin-top:-2px}
.chips.small button{height:28px;font-size:12.5px;padding:0 12px}
.shop-grid{grid-template-columns:repeat(3,1fr)}
.shop-card{position:relative}
.shop-card.span2{grid-column:span 3;flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;text-align:left}
.shop-card.span2 .shop-prev{height:auto}
.shop-card.span2 .shop-name{flex:1}
.shop-card.off{opacity:.5}
.shop-prev{height:74px}
.shop-tag{position:absolute;top:6px;left:6px;z-index:1;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700;color:#1A1204;background:var(--gold)}
.thumb{overflow:hidden;border-radius:10px;background:#081322;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.sq{border:1px solid rgba(120,220,255,.35)}
.thumb.wide{border-radius:6px;border:1px solid var(--edge)}
.thumb.tall{border-radius:5px;border:1px solid rgba(255,255,255,.4)}
.thumb.item{border-radius:12px;box-shadow:0 0 0 1px var(--rc,var(--edge)),0 0 18px color-mix(in srgb,var(--rc,#3FC7FF) 35%,transparent)}
.def-bg{background:linear-gradient(160deg,#10223A,#060C18)}
.info-card{border-radius:8px;padding:12px 14px;margin-bottom:12px;background:linear-gradient(160deg,var(--glass),var(--glass2));border:1px solid var(--edge)}
.info-card b{font-size:14px}
.info-card p{font-size:12.5px;color:var(--dim);margin:4px 0 8px;line-height:1.65}
.odds{display:flex;flex-wrap:wrap;gap:6px}
.odds span{font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;color:var(--rc);border:1px solid color-mix(in srgb,var(--rc) 50%,transparent);background:color-mix(in srgb,var(--rc) 10%,transparent)}
.desc.center,h3.center{text-align:center}
.dn{color:#FF8FA3}
.up{color:var(--grn)}

.bag-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bag-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:8px;background:rgba(3,8,18,.5);border:1px solid color-mix(in srgb,var(--rc) 45%,transparent);min-width:0}
.bag-item:active{transform:scale(.97)}
.bag-n{position:absolute;top:4px;right:6px;font-family:var(--ui);font-weight:700;font-size:13px;color:var(--fg);text-shadow:0 1px 4px #000}
.bag-name{font-size:11px;color:var(--dim);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key-pick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.key-pick button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:8px;background:rgba(3,8,18,.55);border:1px solid color-mix(in srgb,var(--rc) 55%,transparent)}
.key-pick span{font-size:12.5px;font-weight:700}
.key-pick small{font-size:10.5px;color:#FFD5A0}

.closet-item.wide{width:104px}
.open-fx{position:relative;height:300px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:12px;
  background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--rc) 35%,transparent),transparent 65%),#050A14}
.fx-ring{position:absolute;width:180px;height:180px;border-radius:50%;border:2px solid var(--rc);box-shadow:0 0 40px var(--rc);opacity:0;animation:fxRing 1.2s ease-out .55s forwards}
.fx-rays{position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--rc) 30%,transparent) 0 8deg,transparent 8deg 24deg);opacity:0;animation:fxRays 6s linear .7s infinite}
.fx-chest{position:absolute;animation:fxShake .6s ease-in-out,fxOut .35s ease-in .6s forwards}
.fx-prize{position:relative;opacity:0;transform:scale(.5);animation:fxIn .5s cubic-bezier(.2,1.5,.4,1) .8s forwards;text-align:center}
.prize-stars{font-family:var(--ui);font-weight:700;font-size:48px;color:var(--gold);text-shadow:0 0 30px rgba(255,211,122,.8)}
/* v11：一次開出多項的結果卡 */
.open-fx.multi{height:auto;min-height:260px;padding:20px 10px;overflow-y:auto;max-height:62vh;align-items:flex-start}
.open-fx.multi .fx-prize{width:100%}
.prize-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin:12px auto 0;max-width:340px}
.prize-cell{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;padding:9px 4px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--edge)}
.prize-cell b{font-size:12px;font-weight:600;text-align:center;line-height:1.25;word-break:break-all}
.prize-cell small{font-size:11px;color:var(--dim);text-align:center}
.prize-cell.dup{opacity:.72}
.bj-dealer-id[data-dealer]{cursor:pointer}
/* v11b 幹錢券選牌 */
.pick-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin:14px 0;max-height:46vh;overflow-y:auto;padding:2px}
.pick-card{padding:0;border:0;background:none;cursor:pointer;aspect-ratio:2/3}
.pick-card .pc.back{width:100%;height:100%;border-radius:4px}
.pick-card:disabled{opacity:.25;cursor:default}
.pick-card:not(:disabled):active{transform:scale(.94)}
/* v11b 乾洗髮選頭像 */
.closet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin:12px 0;max-height:46vh;overflow-y:auto;padding:2px}
.closet-cell{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--edge);color:var(--fg);cursor:pointer}
.closet-cell b{font-size:11.5px;font-weight:600;text-align:center;line-height:1.2}
.closet-cell:active{transform:scale(.96)}
.duel-cards{display:flex;justify-content:center;gap:28px;margin:18px 0}
.duel-cards>div{display:flex;flex-direction:column;align-items:center;gap:8px}
.duel-cards .lbl{font-size:12px;color:var(--dim)}
/* v12 任務 */
.task-list{max-height:52vh;overflow-y:auto;margin:10px 0;display:flex;flex-direction:column;gap:8px;padding:2px}
.task{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(3,8,18,.55);border:1px solid var(--edge-soft)}
.task.ready{border-color:rgba(75,227,143,.5);background:rgba(75,227,143,.07)}
.task.claimed{opacity:.5}
.task-k{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.task-k b{font-size:14px;font-weight:600}
.task-k small{font-size:11.5px;color:var(--dim);line-height:1.3}
.task-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:3px}
.task-bar i{display:block;height:100%;background:var(--cy);border-radius:2px;transition:width .3s}
.task-num{font-size:11px;color:var(--faint)}
.task-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.task-rew{font-size:12px;color:var(--gold);white-space:nowrap}
.seg .dot{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--grn);color:#04070F;font-size:10.5px;font-weight:700;line-height:16px;text-align:center}
.stat-grid .unk{color:var(--dim);font-size:13px;letter-spacing:.5px}
@keyframes fxShake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg) scale(1.05)}40%{transform:rotate(8deg) scale(1.08)}60%{transform:rotate(-6deg) scale(1.1)}80%{transform:rotate(5deg) scale(1.12)}}
@keyframes fxOut{to{transform:scale(1.6);opacity:0;filter:brightness(3)}}
@keyframes fxIn{to{opacity:1;transform:scale(1)}}
@keyframes fxRing{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(1.8)}}
@keyframes fxRays{0%{opacity:.9;transform:rotate(0)}100%{opacity:.9;transform:rotate(360deg)}}

.top-r{display:flex;align-items:center;gap:10px}
.bell{position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--cy-hi);border:1px solid var(--edge-soft);background:rgba(63,199,255,.06)}
.bell svg{width:20px;height:20px}
.event-bell{font-family:Impact,"Arial Black",var(--ui);font-size:22px;color:#FFD36D;border-color:rgba(255,170,50,.55);background:radial-gradient(circle at 50% 35%,rgba(255,210,90,.2),rgba(255,80,35,.08));box-shadow:0 0 16px rgba(255,140,30,.18)}
.event-bell:active{transform:scale(.94)}
.badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;font-family:var(--ui);font-weight:700;font-size:11px;line-height:17px;color:#fff;background:var(--red);box-shadow:0 0 10px rgba(255,92,121,.7)}
.announce{position:sticky;top:61px;z-index:4;padding:0 12px;margin-top:8px}
.announce-in{max-width:496px;margin:0 auto;display:flex;align-items:flex-start;gap:8px;padding:9px 10px 9px 12px;border-radius:8px;font-size:13.5px;line-height:1.6;
  color:#FFE7B0;background:linear-gradient(135deg,rgba(255,211,122,.14),rgba(255,211,122,.05));border:1px solid rgba(255,211,122,.4);backdrop-filter:blur(8px)}
.announce-in span:nth-child(2){flex:1;white-space:pre-wrap;word-break:break-word}
.announce-in button{flex:none;width:24px;height:24px;border-radius:50%;color:#FFE7B0;opacity:.7}
.mail-list{display:flex;flex-direction:column;gap:8px}
.mail{border-radius:8px;padding:12px 14px;background:linear-gradient(160deg,var(--glass),var(--glass2));border:1px solid var(--edge)}
.mail.got{opacity:.65}
.mail-h{display:flex;justify-content:space-between;gap:10px}
.mail-h b{font-size:15px}
.mail-h span{flex:none;font-size:11.5px;color:var(--faint)}
.mail p{font-size:13px;color:var(--dim);margin-top:4px;white-space:pre-wrap}
.mail-rw{margin-top:8px;padding:6px 10px;border-radius:5px;font-size:13px;font-weight:700;color:var(--gold);background:rgba(255,211,122,.08);border:1px solid rgba(255,211,122,.25)}
.mail-f{display:flex;align-items:center;gap:8px;margin-top:10px}
.mail-f small{flex:1;font-size:11.5px;color:var(--faint)}
.event-hero{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:12px 14px;border-radius:10px;background:linear-gradient(135deg,rgba(255,197,74,.14),rgba(255,75,57,.08));border:1px solid rgba(255,190,75,.38)}
.event-hero .bang{display:grid;place-items:center;flex:none;width:42px;height:42px;border-radius:50%;font-family:Impact,"Arial Black",var(--ui);font-size:29px;color:#1A0B02;background:linear-gradient(145deg,#FFE784,#FF9A38);box-shadow:0 0 20px rgba(255,154,56,.35)}
.event-hero h3{font-family:var(--ui);font-size:19px;font-weight:900;letter-spacing:1px}.event-hero p{font-size:12px;color:var(--dim);margin-top:2px}
.event-list{display:flex;flex-direction:column;gap:9px}
.event-card{position:relative;overflow:hidden;padding:12px 13px 11px 16px;border-radius:9px;background:linear-gradient(150deg,rgba(24,30,45,.96),rgba(8,12,22,.96));border:1px solid rgba(255,199,86,.24)}
.event-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(#FFE06B,#FF7048)}
.event-card.slot::before{background:linear-gradient(#B68CFF,#FF63C8)}.event-card.blackjack::before{background:linear-gradient(#FFDA66,#FF784C)}.event-card.poker::before{background:linear-gradient(#58E9FF,#338CFF)}
.event-tag{display:inline-block;margin-bottom:5px;padding:2px 7px;border-radius:9px;font-family:var(--ui);font-size:10px;font-weight:900;letter-spacing:.8px;color:#0A0D13;background:#FFD36D}
.event-card.slot .event-tag{background:#D7A8FF}.event-card.poker .event-tag{background:#72DFFF}
.event-copy{font-family:var(--ui);font-size:14px;font-weight:800;line-height:1.55;letter-spacing:.35px;color:#FFF4D3}.event-time{display:block;margin-top:4px;font-size:10.5px;color:var(--faint)}
.daily-progress{margin:13px 0;padding:14px 15px;border-radius:11px;background:linear-gradient(145deg,rgba(25,75,103,.28),rgba(8,18,32,.88));border:1px solid rgba(76,205,255,.34);box-shadow:inset 0 0 24px rgba(45,181,235,.04)}
.daily-progress.done{border-color:rgba(78,226,155,.48);background:linear-gradient(145deg,rgba(25,103,73,.28),rgba(8,24,28,.88))}
.daily-progress .dp-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.daily-progress .dp-top span{font-size:12px;color:var(--dim)}.daily-progress .dp-top b{font-family:var(--ui);font-size:21px;color:var(--cy-hi)}.daily-progress.done .dp-top b{color:var(--grn)}
.daily-progress .dp-bar{height:6px;margin:9px 0 8px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.08)}.daily-progress .dp-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#25AEE7,#6EE9FF);transition:width .35s}.daily-progress.done .dp-bar i{background:linear-gradient(90deg,#31C983,#86F2B9)}
.daily-progress p{font-size:12px;line-height:1.6;color:var(--dim)}.daily-progress p b{color:var(--fg)}
.rank-top{display:flex;align-items:center;gap:9px}.rank-top .seg{flex:1}.rank-top .rules-btn{width:34px;height:34px}
.ta{width:100%;padding:10px 12px;border-radius:4px;font-size:15px;color:var(--fg);background:rgba(3,8,18,.72);border:1px solid var(--edge);resize:vertical;font-family:inherit}
.ta.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.fld-grid.three{grid-template-columns:repeat(3,1fr)}
.adm-cat .row{gap:10px}
.adm-cat .nm1{font-weight:500}
.fld input[type=datetime-local]{color-scheme:dark}
.fld-grid>*{min-width:0}
.fld input,.fld .sel,.fld .ta{min-width:0;max-width:100%}
.sheet{overflow-x:hidden}

/* ---------- 意見箱 ---------- */
.feedback-types{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 4px}
.feedback-type{position:relative;overflow:hidden;min-width:0;min-height:142px;padding:18px 14px;border-radius:11px;text-align:left;background:linear-gradient(150deg,rgba(18,45,72,.86),rgba(6,14,27,.92));border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(168,238,255,.08)}
.feedback-type::after{content:'';position:absolute;width:100px;height:100px;right:-44px;bottom:-48px;border-radius:50%;background:rgba(63,199,255,.12);filter:blur(2px)}
.feedback-type.idea{background:linear-gradient(150deg,rgba(47,36,82,.78),rgba(9,13,28,.94));border-color:rgba(187,137,255,.34)}
.feedback-type.idea::after{background:rgba(187,137,255,.14)}
.feedback-type:active{transform:scale(.98)}
.feedback-type .ico{display:grid;place-items:center;width:42px;height:42px;margin-bottom:13px;border-radius:10px;font-family:var(--ui);font-weight:800;font-size:24px;color:#06121c;background:linear-gradient(145deg,var(--cy-hi),var(--cy));box-shadow:0 0 22px rgba(63,199,255,.26)}
.feedback-type.idea .ico{background:linear-gradient(145deg,#E1C6FF,#A16CFF);box-shadow:0 0 22px rgba(161,108,255,.24)}
.feedback-type b{display:block;font-size:16px}.feedback-type small{display:block;margin-top:4px;font-size:11.5px;line-height:1.55;color:var(--dim);word-break:break-word}
.feedback-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.feedback-card{padding:14px;border-radius:10px;background:linear-gradient(155deg,rgba(15,34,57,.82),rgba(6,13,25,.92));border:1px solid var(--edge-soft)}
.feedback-card.pending{border-left:3px solid var(--cy)}.feedback-card.received{border-left:3px solid var(--grn)}.feedback-card.rewarded{border-left:3px solid var(--gold)}
.feedback-head{display:flex;align-items:flex-start;gap:9px}.feedback-head>div{flex:1;min-width:0}.feedback-head b{display:block;font-size:14.5px;word-break:break-word}.feedback-head small{display:block;margin-top:2px;font-size:11px;color:var(--faint)}
.feedback-status{flex:none;padding:3px 8px;border-radius:10px;font-size:10.5px;font-weight:700;color:var(--cy-hi);background:rgba(63,199,255,.09);border:1px solid var(--edge)}
.feedback-card.received .feedback-status{color:#C8F7DB;border-color:rgba(75,227,143,.35);background:rgba(75,227,143,.08)}
.feedback-card.rewarded .feedback-status{color:#FFE7B0;border-color:rgba(255,211,122,.35);background:rgba(255,211,122,.08)}
.feedback-body{margin-top:9px;font-size:12.5px;line-height:1.65;color:var(--dim);white-space:pre-wrap;word-break:break-word}
.feedback-reward{margin-top:9px;padding:7px 9px;border-radius:6px;font-size:12px;color:var(--gold);background:rgba(255,211,122,.07);border:1px solid rgba(255,211,122,.2)}
.feedback-note{margin-top:7px;font-size:11.5px;color:var(--faint)}
.feedback-admin{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;padding-top:10px;border-top:1px solid var(--edge-soft)}
.feedback-admin .mini{min-height:34px;padding:0 11px}.feedback-admin .push{margin-left:auto}
@media(max-width:360px){.feedback-types{grid-template-columns:1fr}.feedback-type{min-height:116px}}

/* ---------- 小遊戲 ---------- */
.pk-mine{flex:none;min-height:70px}
.felt{min-height:0}
.game-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.game.mini-g{flex-direction:column;align-items:flex-start;gap:8px;min-height:0;padding:12px}
.game.mini-g .game-suit{width:42px;height:42px;font-size:22px;font-family:var(--ui);font-weight:700}
.game.mini-g h3{font-size:15px}
.game.mini-g p{font-size:11.5px}
.g-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}

.dice-tray{position:relative;display:flex;justify-content:center;align-items:center;gap:14px;padding:22px 10px 42px;border-radius:14px;background:radial-gradient(ellipse at 50% 30%,rgba(63,199,255,.14),transparent 60%),linear-gradient(180deg,#0C2038,#070E1E);border:1px solid var(--edge)}

.die i.on{background:#0B1622}
.die.red i.on{background:#D3172F}
.dice-tray.rolling .die{animation:dieShake .35s ease-in-out infinite}
.dice-tray.rolling .die.d1{animation-delay:.08s}.dice-tray.rolling .die.d2{animation-delay:.16s}
@keyframes dieShake{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-18deg) translateY(-8px)}75%{transform:rotate(16deg) translateY(4px)}}
.dice-sum{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:13px;color:var(--dim)}

.dice-sum .up{font-family:var(--ui);font-weight:700;color:var(--grn)}.dice-sum .dn{font-family:var(--ui);font-weight:700;color:#FF8FA3}
.dboard{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.drow{display:grid;gap:6px}
.drow.four{grid-template-columns:repeat(4,1fr)}
.drow.six{grid-template-columns:repeat(6,1fr)}
.drow.seven{grid-template-columns:repeat(7,1fr)}
.dc{position:relative;min-width:0;padding:8px 2px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:2px;background:linear-gradient(160deg,var(--glass),var(--glass2));border:1px solid var(--edge)}
.dc b{font-size:17px;font-weight:700;line-height:1.1}
.dc small{font-size:9.5px;color:var(--faint);white-space:nowrap}
.dc.tot b{font-family:var(--ui);font-size:15px}
.dc.hit{border-color:rgba(75,227,143,.8);box-shadow:0 0 16px rgba(75,227,143,.35)}
.dc.miss{opacity:.45}
.dc .chip{position:absolute;top:-6px;right:-4px;padding:0 5px;border-radius:9px;font-family:var(--ui);font-weight:700;font-size:10.5px;line-height:17px;color:#1A1204;background:linear-gradient(135deg,#FFE6AE,var(--gold));box-shadow:0 0 8px rgba(255,211,122,.5)}
.die.xs{width:13px;height:13px;padding:2px;border-radius:3px}.die.xs i{width:2.5px;height:2.5px}
.die.sm{width:26px;height:26px;padding:4px;border-radius:6px}.die.sm i{width:4.5px;height:4.5px}
.mini-dice{display:flex;gap:1px}
.dice-bar .act-row .btn{min-height:52px}

.seg button{padding:0 2px;font-size:13px}
.dex-hero{display:flex;align-items:center;gap:14px;border-radius:12px;padding:14px 16px;background:linear-gradient(160deg,var(--glass),var(--glass2));border:1px solid var(--edge)}
.dex-num{font-family:var(--ui);font-size:15px;color:var(--dim)}.dex-num b{font-size:28px;color:var(--gold)}
.dex-bar{flex:1;height:6px;border-radius:3px;background:rgba(63,199,255,.1);overflow:hidden}
.dex-bar i{display:block;height:100%;background:linear-gradient(90deg,#1FA5DE,var(--cy))}
.dex-desc{font-size:12px;color:var(--faint);margin:-6px 2px 10px}
.dex-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dex-grid.bg{grid-template-columns:repeat(2,1fr)}
.dex-grid.back{grid-template-columns:repeat(6,1fr)}
.dex-item{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.dex-img{width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;background:rgba(3,8,18,.6);border:1px solid var(--edge-soft)}
.dex-grid.bg .dex-img{aspect-ratio:3/1}
.dex-grid.back .dex-img{aspect-ratio:2/5}
.dex-grid.dex .dex-img{background:rgba(255,255,255,.04)}
.dex-img img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) brightness(.18) contrast(.8);transition:filter .3s}
.dex-grid.dex .dex-img img{object-fit:contain;padding:6px}
.dex-item.got .dex-img{border-color:rgba(255,211,122,.45)}
.dex-item.got .dex-img img{filter:none}
.dex-item.equipped .dex-img{border-color:var(--cy);box-shadow:0 0 0 2px rgba(63,199,255,.18),0 0 18px rgba(63,199,255,.24)}
.dex-item.rare .dex-img{background:radial-gradient(circle at 50% 20%,rgba(255,211,122,.16),rgba(255,255,255,.03))}
.dex-img{position:relative}
.dex-bonus{position:absolute;right:4px;top:4px;padding:2px 5px;border-radius:8px;background:rgba(3,8,18,.88);color:var(--gold);font:700 9px/1.2 var(--ui);border:1px solid rgba(255,211,122,.3)}
.dex-equipped{position:absolute;left:4px;top:4px;padding:2px 5px;border-radius:8px;background:rgba(19,116,150,.92);color:#fff;font:700 9px/1.2 var(--ui)}
.dex-item span{font-size:11px;color:var(--faint);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dex-item.got span{color:var(--fg)}
.dex-view.locked img{filter:grayscale(1) brightness(.18)}
.doodle-bank{margin-top:10px;padding:12px 14px;border-radius:12px;background:linear-gradient(135deg,rgba(63,199,255,.1),rgba(255,211,122,.07));border:1px solid var(--edge);display:flex;justify-content:space-between;align-items:center;gap:10px}
.doodle-bank b{font-family:var(--ui);font-size:20px;color:var(--gold)}
.doodle-bank small{display:block;color:var(--faint);margin-top:3px}
.doodle-bank .done{color:var(--grn)}

/* ---------- 隱藏個人領域：星界龍域 ---------- */
.profile-domain{position:fixed;inset:0;z-index:90;overflow:hidden;background:#01030a;perspective:900px;cursor:pointer;touch-action:manipulation;isolation:isolate;animation:domainCurtain 5.5s linear forwards}
.profile-domain.fx-out{animation:domainSkip .18s ease-out forwards}
.domain-space{position:absolute;inset:-8%;transform-style:preserve-3d;animation:domainCamera 5.5s cubic-bezier(.16,.82,.18,1) forwards}
.domain-nebula{position:absolute;inset:0;background:radial-gradient(circle at 50% 48%,rgba(38,204,255,.22) 0 6%,rgba(74,53,198,.22) 18%,transparent 42%),radial-gradient(circle at 18% 22%,rgba(126,69,255,.26),transparent 32%),radial-gradient(circle at 82% 78%,rgba(0,217,255,.16),transparent 30%),linear-gradient(145deg,#01030a 8%,#071027 48%,#02030c 90%);filter:saturate(1.25);animation:domainNebula 5.5s ease-out forwards}
.domain-stars{position:absolute;inset:0;width:100%;height:100%;opacity:.9;mix-blend-mode:screen}
.domain-rift{position:absolute;top:-12%;bottom:-12%;width:53%;background:linear-gradient(110deg,transparent 70%,rgba(143,236,255,.28) 76%,#e9fbff 78%,rgba(91,75,255,.5) 79%,transparent 84%);filter:drop-shadow(0 0 18px #58dfff) drop-shadow(0 0 44px rgba(116,61,255,.9));will-change:transform;z-index:2}
.domain-rift.left{left:-3%;transform-origin:right center;animation:riftLeft 1.2s cubic-bezier(.15,.75,.2,1) forwards}
.domain-rift.right{right:-3%;transform:scaleX(-1);transform-origin:right center;animation:riftRight 1.2s cubic-bezier(.15,.75,.2,1) forwards}
.domain-floor{position:absolute;left:50%;top:61%;width:min(920px,145vw);height:min(540px,72vw);transform:translate(-50%,-50%) rotateX(67deg) translateZ(-120px);border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 8%,rgba(78,210,255,.22) 8.3% 8.7%,transparent 9% 15%),conic-gradient(from 20deg,transparent,rgba(91,76,255,.18),transparent 12%,rgba(72,211,255,.14),transparent 25%);box-shadow:0 0 90px rgba(77,86,255,.3);opacity:0;animation:floorRise 5.25s .28s ease-out forwards;z-index:1}
.domain-seal{position:absolute;left:50%;top:48%;width:min(670px,96vmin);aspect-ratio:1;transform:translate(-50%,-50%);transform-style:preserve-3d;z-index:4;opacity:0;animation:sealArrive 5.25s .12s cubic-bezier(.12,.78,.15,1) forwards}
.domain-ring{position:absolute;inset:6%;border-radius:50%;border:2px solid rgba(142,238,255,.54);box-shadow:inset 0 0 26px rgba(80,204,255,.16),0 0 28px rgba(91,76,255,.34);background:repeating-conic-gradient(from 0deg,rgba(181,247,255,.85) 0 .7deg,transparent .9deg 12deg);mask:radial-gradient(circle,transparent 0 46%,#000 47% 49%,transparent 50%);animation:ringSpin 7s linear infinite}
.domain-ring.r2{inset:15%;border-color:rgba(174,104,255,.65);background:repeating-conic-gradient(from 8deg,rgba(174,104,255,.9) 0 1deg,transparent 1.4deg 20deg);mask:radial-gradient(circle,transparent 0 45%,#000 46% 49%,transparent 50%);animation-direction:reverse;animation-duration:4.8s}
.domain-ring.r3{inset:27%;border:1px solid rgba(229,250,255,.75);background:repeating-conic-gradient(from 18deg,#dffaff 0 .8deg,transparent 1deg 30deg);mask:radial-gradient(circle,transparent 0 43%,#000 44% 48%,transparent 49%);animation-duration:3.2s}
.domain-glyph{position:absolute;left:50%;top:50%;width:15px;height:15px;margin:-7px;color:#bcefff;text-shadow:0 0 8px #6be8ff;font:800 11px/15px var(--ui);transform:rotate(var(--a)) translateY(calc(min(300px,43vmin) * -1)) rotate(calc(var(--a) * -1));opacity:.8}
.domain-dragon{position:absolute;left:50%;top:49%;z-index:6;width:min(980px,144vmin);max-width:none;pointer-events:none;transform-origin:50% 52%;filter:drop-shadow(0 0 12px rgba(98,223,255,.9)) drop-shadow(0 0 38px rgba(102,50,255,.7));opacity:0;will-change:transform,opacity,filter;animation:dragonAwake 5.35s .05s cubic-bezier(.12,.8,.16,1) forwards}
.domain-core{position:absolute;left:50%;top:50%;z-index:7;width:clamp(92px,22vmin,148px);height:clamp(92px,22vmin,148px);transform:translate(-50%,-50%) scale(.05) translateZ(-400px);border-radius:26%;display:grid;place-items:center;opacity:0;animation:coreLock 5.05s .25s cubic-bezier(.15,1.25,.25,1) forwards}
.domain-core::before,.domain-core::after{content:"";position:absolute;inset:-18%;border-radius:34%;border:1px solid rgba(167,238,255,.75);transform:rotate(45deg);box-shadow:0 0 22px #47d8ff,inset 0 0 20px rgba(122,57,255,.4);animation:coreTurn 2.4s linear infinite}
.domain-core::after{inset:-31%;border-style:dashed;border-color:rgba(154,98,255,.65);animation-direction:reverse;animation-duration:3.2s}
.domain-core .pav{width:100%!important;height:100%!important;border-radius:22%!important;border:2px solid rgba(220,251,255,.88);box-shadow:0 0 24px #54dcff,0 0 70px rgba(102,54,255,.88);transform:translateZ(50px)}
.domain-shard{position:absolute;left:50%;top:50%;z-index:5;width:clamp(12px,3vmin,26px);height:clamp(55px,15vmin,126px);clip-path:polygon(50% 0,100% 70%,58% 100%,0 68%);background:linear-gradient(90deg,rgba(25,24,68,.92),rgba(143,233,255,.95) 48%,rgba(82,42,186,.85));box-shadow:0 0 20px #5ce4ff;opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) translateY(var(--d)) translateZ(var(--z)) scale(.15);animation:shardBurst 5.1s var(--delay) cubic-bezier(.1,.8,.2,1) forwards}
.domain-flash{position:absolute;inset:0;z-index:9;pointer-events:none;background:#eafcff;mix-blend-mode:screen;opacity:0;animation:domainFlash 5.4s linear forwards}
.domain-title{position:absolute;left:50%;bottom:clamp(72px,12vh,125px);z-index:10;transform:translate(-50%,35px) scale(.7);text-align:center;white-space:nowrap;opacity:0;animation:titleReveal 5.35s .15s cubic-bezier(.15,.9,.2,1) forwards}
.domain-title small{display:block;margin-bottom:3px;color:#9eeeff;font:700 11px var(--ui);letter-spacing:.55em;text-indent:.55em;text-shadow:0 0 12px #4fdcff}
.domain-title b{display:block;color:#f1fbff;font:900 clamp(27px,7vw,52px)/1 var(--ui);letter-spacing:.16em;text-indent:.16em;text-shadow:0 0 5px #fff,0 0 16px #3bdcff,0 0 42px #7549ff}
.domain-name{position:absolute;left:50%;bottom:clamp(47px,7vh,82px);z-index:10;transform:translateX(-50%);color:rgba(216,240,255,.8);font:600 12px var(--ui);letter-spacing:.16em;opacity:0;animation:nameReveal 5.35s .2s ease-out forwards}
.domain-skip{position:absolute;right:14px;top:calc(14px + var(--safe-t));z-index:11;padding:7px 10px;border-radius:999px;color:rgba(225,244,255,.65);font:600 10px var(--ui);letter-spacing:.08em;background:rgba(4,9,25,.38);border:1px solid rgba(153,223,255,.18);opacity:0;animation:skipReveal .3s 1s forwards}
.fx-none{display:grid;place-items:center;color:var(--faint);font-size:22px;background:rgba(3,8,18,.55)}
@keyframes domainCurtain{0%{opacity:0}4%,86%{opacity:1}100%{opacity:0}}
@keyframes domainSkip{to{opacity:0;transform:scale(1.04);filter:brightness(1.8)}}
@keyframes domainCamera{0%{transform:scale(1.14) rotateZ(-1deg)}18%{transform:scale(1)}39%{transform:scale(1.035) translate3d(-2px,1px,0)}42%{transform:scale(1.05) translate3d(5px,-3px,0)}46%{transform:scale(1.03)}70%{transform:scale(1.08)}100%{transform:scale(1.13)}}
@keyframes domainNebula{0%{filter:brightness(.3) saturate(.5);transform:scale(1.15)}30%{filter:brightness(.65) saturate(1)}52%{filter:brightness(1.4) saturate(1.6)}100%{filter:brightness(.7) saturate(1.25);transform:scale(1)}}
@keyframes riftLeft{0%{transform:translateX(55%) scaleX(.03);opacity:0}20%{opacity:1}52%{transform:translateX(4%) scaleX(.08)}100%{transform:translateX(-46%) scaleX(1.25);opacity:.45}}
@keyframes riftRight{0%{transform:translateX(-55%) scaleX(-.03);opacity:0}20%{opacity:1}52%{transform:translateX(-4%) scaleX(-.08)}100%{transform:translateX(46%) scaleX(-1.25);opacity:.45}}
@keyframes floorRise{0%,15%{opacity:0;transform:translate(-50%,-30%) rotateX(82deg) translateZ(-380px) scale(.3)}43%{opacity:.8}100%{opacity:.38;transform:translate(-50%,-50%) rotateX(67deg) translateZ(-120px) scale(1.18)}}
@keyframes sealArrive{0%,20%{opacity:0;transform:translate(-50%,-50%) translateZ(-800px) rotateZ(-70deg) scale(.08)}43%{opacity:1}58%{transform:translate(-50%,-50%) translateZ(80px) rotateZ(5deg) scale(1.08)}100%{opacity:.7;transform:translate(-50%,-50%) translateZ(0) rotateZ(16deg) scale(1)}}
@keyframes ringSpin{to{transform:rotate(360deg)}}
@keyframes dragonAwake{0%,20%{opacity:0;transform:translate(-50%,-48%) translateZ(-900px) rotateZ(-48deg) scale(.06);filter:blur(10px) brightness(.2)}34%{opacity:.18}48%{opacity:1;transform:translate(-50%,-50%) translateZ(100px) rotateZ(7deg) scale(.9);filter:blur(0) brightness(1.85)}61%{transform:translate(-50%,-50%) translateZ(30px) rotateZ(-2deg) scale(1.06);filter:brightness(1.1)}82%{opacity:1;transform:translate(-50%,-51%) translateZ(80px) rotateZ(1deg) scale(1.12)}100%{opacity:.94;transform:translate(-50%,-52%) translateZ(130px) rotateZ(3deg) scale(1.2);filter:brightness(.8)}}
@keyframes coreLock{0%,39%{opacity:0;transform:translate(-50%,-50%) scale(.05) translateZ(-400px) rotate(-45deg)}53%{opacity:1;transform:translate(-50%,-50%) scale(1.25) translateZ(90px) rotate(3deg)}66%,100%{opacity:1;transform:translate(-50%,-50%) scale(1) translateZ(40px)}}
@keyframes coreTurn{to{transform:rotate(405deg)}}
@keyframes shardBurst{0%,28%{opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) translateY(0) translateZ(-400px) scale(.1)}47%{opacity:1}65%{transform:translate(-50%,-50%) rotate(var(--r)) translateY(var(--d)) translateZ(var(--z)) scale(1)}100%{opacity:.25;transform:translate(-50%,-50%) rotate(calc(var(--r) + 35deg)) translateY(calc(var(--d) * 1.16)) translateZ(var(--z)) scale(.8)}}
@keyframes domainFlash{0%,37%,43%,51%,100%{opacity:0}39%{opacity:.82}41%{opacity:.05}53%{opacity:.38}56%{opacity:0}}
@keyframes titleReveal{0%,55%{opacity:0;transform:translate(-50%,35px) scale(.7);filter:blur(8px)}68%,88%{opacity:1;transform:translate(-50%,0) scale(1);filter:none}100%{opacity:.3;transform:translate(-50%,-8px) scale(1.04)}}
@keyframes nameReveal{0%,66%{opacity:0;transform:translate(-50%,10px)}78%,92%{opacity:1;transform:translate(-50%,0)}100%{opacity:.2}}
@keyframes skipReveal{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.profile-domain,.domain-nebula,.domain-rift,.domain-floor,.domain-seal,.domain-dragon,.domain-core,.domain-title,.domain-name,.domain-flash{animation-delay:0s!important;animation-duration:4.2s!important}.domain-shard{display:none}}

}

}

/* ---------- 台灣時間、本季 ---------- */
var TW = 8 * 3600000, DAY = 86400000;
function seasonRange(ms) {
  var tw = new Date(ms + TW);
  var dow = (tw.getUTCDay() + 6) % 7;
  var start = Date.UTC(tw.getUTCFullYear(), tw.getUTCMonth(), tw.getUTCDate()) - dow * DAY - TW;
  return { start: start, end: start + 7 * DAY, dow: dow };
}
function isoWeek(ms) {
  var r = seasonRange(ms);
  var thu = new Date(r.start + TW + 3 * DAY);
  var y = thu.getUTCFullYear();
  var jan4 = new Date(Date.UTC(y, 0, 4));
  var jan4Mon = Date.UTC(y, 0, 4) - ((jan4.getUTCDay() + 6) % 7) * DAY;
  var thuDay = Date.UTC(thu.getUTCFullYear(), thu.getUTCMonth(), thu.getUTCDate());
  return Math.round((thuDay - 3 * DAY - jan4Mon) / (7 * DAY)) + 1;
}
function twDate(ms) { var d = new Date(ms + TW); return (d.getUTCMonth() + 1) + '/' + d.getUTCDate(); }

/* =====================================================================
   Firebase

firebase.initializeApp(FB_CONFIG);

// 本機模擬器：網址加 ?emu=1
if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /[?&]emu=1/.test(location.search)) {
