}

var EXPIRED = { 'session-expired': 1, 'no-session': 1, 'no-auth': 1 };

/* 呼叫 Cloud Function，錯誤統一整理成中文 */
function call(name, data) {
  return fns.httpsCallable(name)(data || {}).then(function (r) { return r.data; }, function (e) {
    var code = (e && e.code) || '';
    var err = new Error((e && e.message) || '連線失敗');
    err.reason = (e && e.details && e.details.reason) || null;
    err.code = code;
    if (code === 'functions/not-found') err.message = '伺服器功能還沒部署';
    else if (code === 'functions/unavailable' || code === 'functions/deadline-exceeded') err.message = '連線逾時，檢查網路再試一次';
    else if (code === 'functions/internal' && !err.reason && /^internal$/i.test(err.message)) err.message = '連不上伺服器，稍後再試';
    if (err.reason && EXPIRED[err.reason] && S.me) {
      endSession();
      toast(err.message, 'bad');
    }
    throw err;
  });
}

/* =====================================================================
   狀態
   ===================================================================== */
var S = {
  me: null,            // { pid, name, role }
  player: null,        // players/{pid} 即時資料
  cfg: null,           // config/app
  roster: [],          // 全部玩家（依編號排序）
  players: {},         // pid → 玩家資料
  season: null,        // 本季狀態 seasons/{sid}
  sid: null,           // 本季 ID，例如 2026-W38
  acc: null,           // 我的本季帳戶
  accounts: [],        // 本季仍有玩家資料的帳戶（排名、利率）
  accountRoster: [],   // Firestore 本季帳戶原始快照（用來排除已刪除玩家）
  seasonUnsub: null,
  tab: 'home',
  unsubs: [],
  tick: null
};

/* =====================================================================
   啟動
   ===================================================================== */
var authUser = null, authWait = [], started = false;

function bootMsg(t) { $('bootMsg').textContent = t || ''; }

auth.onAuthStateChanged(function (u) {
  authUser = u;
  if (!u) {
    auth.signInAnonymously().catch(function (e) {
      var msg = e && (e.code === 'auth/operation-not-allowed' || e.code === 'auth/admin-restricted-operation')
        ? 'Firebase 的匿名登入沒有開啟'
        : '連不上伺服器，檢查網路後重新整理';
      bootMsg(msg);
      if (started) toast(msg, 'bad');
    });
    return;
  }
  authWait.splice(0).forEach(function (f) { f(u); });
  if (!started) { started = true; startup(u); }
});

function whenAuth() {
  return authUser ? Promise.resolve(authUser) : new Promise(function (r) { authWait.push(r); });
}

function startup(u) {
  u.getIdTokenResult().then(function (t) {
    if (!t.claims.pid) return showGate();
    bootMsg('');
    return call('authSession').then(enterApp, function (e) {
      if (!EXPIRED[e.reason]) toast(e.message, 'bad');
      showGate();
    });
  }).catch(function () { showGate(); });
}

/* =====================================================================
   登入頁
   ===================================================================== */
var G = { mode: 'idle', pid: '', player: null, seq: 0 };

function showGate() {
  $('boot').hidden = true;
  $('app').hidden = true;
  $('gate').hidden = false;
  document.body.className = 'gate-mode';
  var last = LS.get('lastPid', '');
  var input = $('pid');
  if (!input.value && /^\d{2}$/.test(last)) input.value = last;
  $('gPw').value = ''; $('gPw2').value = '';
  paintCells();
  onPid();
}

function paintCells() {
  var v = $('pid').value, cells = document.querySelectorAll('.cell');
  for (var i = 0; i < 2; i++) {
    cells[i].textContent = v[i] || '';
    cells[i].classList.toggle('fill', !!v[i]);
    cells[i].classList.toggle('cur', i === v.length);
  }
  $('pidBox').classList.toggle('ok', v.length === 2);
}

$('pid').addEventListener('input', function () {
  var v = this.value.replace(/\D/g, '').slice(0, 2);
  if (v !== this.value) this.value = v;
  paintCells();
  onPid();
  if (v.length === 2) setTimeout(function () { var f = firstField(); if (f && G.mode !== 'closed') f.focus(); }, 60);
});
$('pid').addEventListener('focus', function () { $('pidBox').classList.add('focus'); paintCells(); });
$('pid').addEventListener('blur', function () { $('pidBox').classList.remove('focus'); });

function firstField() {
  if (!$('fName').hidden) return $('gName');
  if (!$('fPw').hidden) return $('gPw');
  return null;
}

function setStatus(html, warn) {
  var el = $('gateStatus');
  el.innerHTML = html;
  el.classList.toggle('warn', !!warn);
}

function setMode(mode) {
  G.mode = mode;
  var f = { name: false, pw: false, pw2: false, show: false, label: '密碼', btn: '進入', ac: 'current-password' };
  if (mode === 'login') { f.pw = true; f.show = true; f.btn = '登入'; }
  else if (mode === 'claim') { f.pw = f.pw2 = true; f.show = true; f.label = '設一組密碼'; f.btn = '設定密碼並進入'; f.ac = 'new-password'; }
  else if (mode === 'register') { f.name = f.pw = f.pw2 = true; f.show = true; f.label = '設一組密碼'; f.btn = '註冊'; f.ac = 'new-password'; }
  else if (mode === 'bootstrap') { f.name = f.pw = f.pw2 = true; f.show = true; f.label = '設一組密碼'; f.btn = '建立管理員帳號'; f.ac = 'new-password'; }
  $('fName').hidden = !f.name;
  $('fPw').hidden = !f.pw;
  $('fPw2').hidden = !f.pw2;
  $('lPw').textContent = f.label;
  $('gPw').setAttribute('autocomplete', f.ac);
  $('gPw').placeholder = f.pw2 ? '至少 4 碼' : '';
  $('gateBtn').textContent = f.btn;
  $('gateReveal').classList.toggle('on', f.show);
}

function onPid() {
  var v = $('pid').value;
  var seq = ++G.seq;
  if (v.length < 2) {
    G.player = null;
    setMode('idle');
    setStatus('兩位數字，例如 07');
    return;
  }
  setMode('idle');
  setStatus('查詢中…');
  whenAuth().then(function () {
    return Promise.all([
      db.collection('players').doc(v).get(),
      db.collection('config').doc('app').get()
    ]);
  }).then(function (r) {
    if (seq !== G.seq) return;
    var p = r[0].exists ? r[0].data() : null, cfg = r[1].exists ? r[1].data() : null;
    G.pid = v; G.player = p;
    if (p && p.claimed) {
      setMode('login');
      setStatus('<div class="who">' + playerAvatar(p, 40) + '<div><b>' + esc(p.name) + '</b><br><span>輸入密碼登入</span></div></div>');
    } else if (p) {
      setMode('claim');
      setStatus('<div class="who">' + hexAvatar(p.name, 40) + '<div><b>' + esc(p.name) + '</b><br><span>管理員幫你開好帳號了，設一組密碼就能進入</span></div></div>');
    } else if (!cfg) {
      setMode('bootstrap');
      setStatus('目前還沒有任何帳號，第一個註冊的人會成為管理員。');
    } else if (cfg.registrationOpen) {
      setMode('register');
      setStatus('這個編號還沒人用，填好就是你的。');
    } else {
      setMode('closed');
      setStatus('這個編號還沒開通，請找管理員開帳號。', true);
    }
  }).catch(function () {
    if (seq !== G.seq) return;
    setMode('idle');
    setStatus('連不上伺服器，檢查網路後再輸入一次。', true);
  });
}

$('gateForm').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var mode = G.mode, pid = G.pid, btn = $('gateBtn');
  if (btn.disabled || ['login', 'claim', 'register', 'bootstrap'].indexOf(mode) < 0) return;
  var name = $('gName').value.trim(), pw = $('gPw').value, pw2 = $('gPw2').value;

  if ((mode === 'register' || mode === 'bootstrap') && !name) { toast('要填名字', 'bad'); return $('gName').focus(); }
  if (!pw) { toast('要打密碼', 'bad'); return $('gPw').focus(); }
  if (mode !== 'login') {
    if (pw.length < 4) { toast('密碼至少 4 碼', 'bad'); return $('gPw').focus(); }
    if (pw !== pw2) { toast('兩次密碼不一樣', 'bad'); return $('gPw2').focus(); }
  }

  var fn = mode === 'login' ? 'authLogin' : mode === 'claim' ? 'authSetPassword' : 'authRegister';
  var data = { pid: pid, pw: pw };
  if (mode === 'register' || mode === 'bootstrap') data.name = name;

  busy(btn, true);
  whenAuth().then(function () { return call(fn, data); }).then(function (profile) {
    return authUser.getIdToken(true).then(function () { return profile; });
  }).then(function (profile) {
    LS.set('lastPid', pid);
    $('gPw').value = ''; $('gPw2').value = ''; $('gName').value = '';
    busy(btn, false);
    enterApp(profile);
    if (mode === 'bootstrap') toast('你是管理員了，到「我的」可以管理帳號', 'good');
  }).catch(function (e) {
    busy(btn, false);
    toast(e.message, 'bad');
    if (e.reason === 'bad-password') { $('gPw').value = ''; $('gPw').focus(); }
    // 狀態可能已經變了（例如別人剛搶先註冊、註冊被關掉），重新查一次
    if (['taken', 'closed', 'already-claimed', 'needs-password', 'not-found'].indexOf(e.reason) >= 0) onPid();
  });
});

/* =====================================================================
   經濟規則（跟伺服器 core/econ.js 同一套，只用來顯示；真正判定在伺服器）
   ===================================================================== */
var ECON_DEF = {
  startingMoney: 5000, loanUnit: 2000, loanRepayAt: 3000, borrowBelow: 1000, bankKeep: 2000,
  loanPerDay: 10,
  interestMin: 0.001, interestMax: 0.006, rankMinHands: 20,
  starPer: 100, starCap: 0, starMinHands: 20
};
var PERIOD = 3 * 3600000;

function econ() {
  var e = (S.cfg && S.cfg.econ) || {}, o = {};
  Object.keys(ECON_DEF).forEach(function (k) { o[k] = typeof e[k] === 'number' ? e[k] : ECON_DEF[k]; });
  return o;
}
function periodStart(ms) { return Math.floor((ms + TW) / PERIOD) * PERIOD - TW; }
function sidOf(ms) {
  var r = seasonRange(ms);
  var y = new Date(r.start + TW + 3 * DAY).getUTCFullYear();
  return y + '-W' + String(isoWeek(ms)).padStart(2, '0');
}
function twDay(ms) {
  var d = new Date(ms + TW);
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
}
function twClock(ms) {
  var d = new Date(ms + TW);
  return (d.getUTCMonth() + 1) + '/' + d.getUTCDate() + ' ' +
    String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0');
}
function hms(ms) {
  var s = Math.max(0, Math.floor(ms / 1000));
  return String(Math.floor(s / 3600)).padStart(2, '0') + ':' + String(Math.floor(s % 3600 / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function inPlayOf(a) {
  var t = 0;
  Object.keys((a && a.inPlay) || {}).forEach(function (g) { t += (a.inPlay[g] && a.inPlay[g].amount) || 0; });
  return t;
}
function maxDeposit(a, c) {
  if (!a || a.loans > 0) return 0;
  return Math.max(0, Math.min(a.wallet, a.wallet + inPlayOf(a) - c.bankKeep));
}
function canBorrow(a, c) {
  return !!a && a.wallet + a.bank.balance + inPlayOf(a) < c.borrowBelow;
}

/* 本季排名與利率 */
function rankTable() {
  var c = econ(), list = S.accounts.slice().sort(function (a, b) { return b.net - a.net; });
  var n = list.length, out = {}, rank = 0, prev = null;
  list.forEach(function (a, i) {
    if (a.net !== prev) { rank = i + 1; prev = a.net; }
    var rate = n <= 1 ? c.interestMin : c.interestMin + (c.interestMax - c.interestMin) * (rank - 1) / (n - 1);
    out[a.pid] = { rank: rank, total: n, rate: rate };
  });
  return out;
}
function pct(rate) {
  var v = rate * 100;
  return (v >= 1 ? v.toFixed(2) : v.toFixed(3)).replace(/0+$/, '').replace(/\.$/, '') + '%';

function contestDoneText(a, name) {
  if (!a) return '完成';

  return '完成';

/* 牌桌狀態更新時呼叫：該我防禦或該我選牌就自動跳出視窗 */
var CONTEST_UI = { key: null, shown: {} };
function contestWatch(st, game) {
  var c = st && st.contest;
  if (!CONTEST_UI.shown) CONTEST_UI.shown = {};
  if (!c) { CONTEST_UI.key = null; return; }
  var inIt = c.from === S.me.pid || c.to === S.me.pid;
  if (c.phase === 'done') {
    CONTEST_UI.key = null;
    // 結束時兩邊都要看到結果，不能只有最後動作的那個人看到
    if (inIt && c.result && !CONTEST_UI.shown[c.id]) {
      CONTEST_UI.shown[c.id] = 1;
      if (c.kind === 'money') sheetDuelResult(c);
      else if (c.from === S.me.pid) toast(contestDoneText({ kind: c.kind }, c.toName), 'good');
    }
    if (inIt && c.blocked && !CONTEST_UI.shown[c.id]) {
      CONTEST_UI.shown[c.id] = 1;
      if (c.from === S.me.pid) toast(c.toName + ' 用鐵碗公擋下來了', 'bad');
    }
    return;
  }
  var mine = c.from === S.me.pid ? c.to : c.from;
  // 把「對方選了沒」也放進 key，對方一選牌就重畫，那張才會變成不能點
  var key = c.id + '|' + c.phase + '|' + (c.picks && c.picks[mine] !== undefined ? 'x' : '');
  if (CONTEST_UI.key === key) return;
  // 只改 key，不要整個換掉物件，不然 shown 會不見
  if (c.phase === 'guard' && c.to === S.me.pid) {
    CONTEST_UI.key = key;
    sheetGuard(c, game);
  } else if (c.phase === 'pick' && (c.from === S.me.pid || c.to === S.me.pid) && c.picks[S.me.pid] === undefined) {
    CONTEST_UI.key = key;
    sheetPickCard(c, game);
  }
}

function feedbackTime(ms) {
  if (!ms) return '';
  var d = new Date(ms + TW);
  return (d.getUTCMonth() + 1) + '/' + d.getUTCDate() + ' ' +
    String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0');
}

function feedbackStatus(x) {
  return x === 'rewarded' ? '已獎勵' : x === 'received' ? '已收到' : '待查看';
}

function feedbackRewardText(r) {
  if (!r) return '';
  var p = [];
  if (r.money) p.push('資產 ' + fmt(r.money));
  if (r.stars) p.push('★ ' + fmt(r.stars));
  Object.keys(r.items || {}).forEach(function (id) {
    p.push((ITEM[id] ? ITEM[id].name : (r.itemName || id)) + ' × ' + r.items[id]);
  });
  return p.join('、');
}

/* 把 [[稀有度, 權重]] 顯示成「稀有 30 / 史詩 70」這種一行文字，好改 */
function rwToText(t) {
  return (t || []).map(function (x) {
    // 舊格式 [稀有度, 權重] 也讀得懂，免得存過舊資料的人打不開
    var r = Array.isArray(x) ? x[0] : x.r, w = Array.isArray(x) ? x[1] : x.w;

  }).join('、');
}
function rwFromText(v) {
  var out = [];
  String(v || '').split(/[、,，]/).forEach(function (part) {
    var m = String(part).trim().match(/^(\S+)\s+([\d.]+)$/);
    if (!m) { if (String(part).trim()) throw new Error('格式要像「傳奇 20、史詩 50」'); return; }
    var r = RARITY.indexOf(m[1]);
    if (r < 1 || r > 6) throw new Error('「' + m[1] + '」不是可以發的稀有度（稀有～神秘）');
    out.push({ r: r, w: Number(m[2]) });
  });
  if (!out.length) throw new Error('至少要填一個稀有度');

}

function planPokerFx(prev, next, first) {
  var fx = PK.fx;
  if (!next || !next.hand) return;
  if (first) {
    fx.pendingDeal = 0; fx.pendingBets = null; fx.pendingPayout = null;
    fx.paidHand = next.lastResult ? next.lastResult.handNo : 0;
    return;
  }

  var sameHand = !!(prev && prev.hand && prev.hand.no === next.hand.no);
  if (!sameHand && next.hand.phase !== 'idle') fx.pendingDeal = next.hand.no;

  if (next.hand.phase !== 'idle') {
    var oldByPid = {};
    if (sameHand) (prev.seats || []).forEach(function (s) { if (s) oldByPid[s.pid] = (s.bet || 0) + (s.committed || 0); });
    var bettors = [];
    (next.seats || []).forEach(function (s) {
      if (!s) return;
      var before = oldByPid[s.pid] || 0, after = (s.bet || 0) + (s.committed || 0);
      if (after > before) bettors.push(s.pid);
    });
    if (bettors.length) {
      if (fx.pendingBets && fx.pendingBets.handNo === next.hand.no) {
        bettors.forEach(function (pid) { if (fx.pendingBets.pids.indexOf(pid) < 0) fx.pendingBets.pids.push(pid); });
        fx.pendingBets.afterDeal = fx.pendingBets.afterDeal || !sameHand;
      } else fx.pendingBets = { handNo: next.hand.no, pids: bettors, afterDeal: !sameHand };
    }
  }

  var nr = next.lastResult, pr = prev && prev.lastResult;
  if (nr && nr.handNo !== fx.paidHand && (!pr || pr.handNo !== nr.handNo)) {
    fx.pendingPayout = nr;
    fx.paidHand = nr.handNo;
  }
}

function pokerDealTargets(st) {
  var H = st.hand, n = st.seats.length, first = [], second = [], active = 0;
  for (var k = 1; k <= n; k++) {
    var s = st.seats[(H.dealer + k + n) % n];
    if (!s || !s.inHand) continue;
    active++;
    var cards;
    if (S.me && s.pid === S.me.pid) cards = $('handDock') ? $('handDock').querySelectorAll('.cb') : [];
    else {
      var seat = pokerFxSeat(s.pid);
      cards = seat ? seat.querySelectorAll('.backs .cb') : [];
    }
    if (cards.length < 2) return null;
    first.push(cards[0]); second.push(cards[1]);
  }
  return active ? first.concat(second) : null;
}

function playPokerFx() {
  if (!window.TokenFX || !PK.st || S.tab !== 'poker') return;
  var fx = PK.fx, felt = $('pkFelt'), H = PK.st.hand, targets = null;
  if (fx.pendingDeal === H.no && H.phase !== 'idle') {
    targets = pokerDealTargets(PK.st);
    if (!targets) return;
    fx.pendingDeal = 0;
    TokenFX.deal(felt, targets);
  }

  if (fx.pendingBets && fx.pendingBets.handNo === H.no) {
    var betJob = fx.pendingBets;
    fx.pendingBets = null;
    var sendBets = function () {
      if (!PK.st || PK.st.hand.no !== betJob.handNo || S.tab !== 'poker') return;
      var froms = betJob.pids.map(pokerFxSeat).filter(function (x) { return !!x; });
      var pot = $('pkCenter').querySelector('.pot');
      if (froms.length && pot) TokenFX.tokensToPot(felt, froms, pot);
    };
    if (betJob.afterDeal) setTimeout(sendBets, 520 + (targets ? targets.length * 92 : 0));
    else sendBets();
  }

  if (fx.pendingPayout && fx.pendingPayout.handNo === H.no) {
    var result = fx.pendingPayout;
    fx.pendingPayout = null;
    var potEl = $('pkCenter').querySelector('.pot');
    if (potEl) result.winners.forEach(function (w) {
      var winner = pokerFxSeat(w.pid);
      if (winner) TokenFX.potToWinner(felt, potEl, winner, w.amount);
    });
  }
}

/* 同一個截止時間，每台裝置最多問一次（6 秒後仍沒變才再問），並隨機延遲 0～1.5 秒，
   讓第一台的結果先傳到其他人，其他人看到新的截止時間就不用再問。 */
function dueTick(G, key, dueAt, fn, data) {
  if (!dueAt) return;
  if (G.tickKey !== key) { G.tickKey = key; G.tickTries = 0; G.jitter = 600 + Math.floor(Math.random() * 1500); }
  if (serverNow() < dueAt + G.jitter) return;

  if (G.tickTries >= 3) return;

}

function statusText() {
  var st = PK.st, H = st.hand, S2 = st.settings, now = serverNow();
  var locked = S.season && S.season.status && S.season.status !== 'active';
  if (H.phase !== 'idle') {
    var t = st.seats[H.turn], left = Math.max(0, Math.ceil((H.deadline - now) / 1000));
    var ph = { preflop: '翻牌前', flop: '翻牌', turn: '轉牌', river: '河牌' }[H.phase];
    return ph + '　' + (t ? esc(t.name) + ' 思考中 <b>' + left + '</b>' : '');
  }
  var lr = st.lastResult && st.lastResult.handNo === H.no ? st.lastResult : null;
  var head = lr ? lr.winners.map(function (w) { return esc(w.name) + ' 贏 ' + fmt(w.amount) + (w.hand ? '（' + esc(w.hand) + '）' : ''); }).join('、') + '<br>' : '';
  var readyN = st.seats.filter(readySeat).length;
  if (locked) return head + '本季結算中，暫停開局';
  if (st.seats.some(function (x) { return x && x.sid && x.sid !== S.sid; })) return head + '上一季還沒結算，等管理員結算後就能繼續';
  if (st.auto && st.auto.nextHandAt) return head + '下一手 <b>' + Math.max(0, Math.ceil((st.auto.nextHandAt - now) / 1000)) + '</b> 秒後開始';
  if (!S2.auto) return head + '等待管理員開始下一手';
  if (readyN < S2.minPlayers) return head + '還差 ' + (S2.minPlayers - readyN) + ' 人就會自動開局';
  return head + '準備開局';
}

var RK = { tab: 'now', last: null, lastSid: null, loading: false };

function rankRows(list, valueOf, eligibleOf) {
  var ok = list.filter(eligibleOf).sort(function (a, b) { return valueOf(b) - valueOf(a); });
  var rest = list.filter(function (x) { return !eligibleOf(x); }).sort(function (a, b) { return valueOf(b) - valueOf(a); });
  var prev = null, rank = 0;
  ok.forEach(function (x, i) { var v = valueOf(x); if (v !== prev) { rank = i + 1; prev = v; } x._rank = rank; });
  rest.forEach(function (x) { x._rank = null; });
  return ok.concat(rest);
}

function dailyRewardCard(practice) {
  var rw = rewardClientCfg();
  if (!S.acc || rw.enabled === false || practice) return '';
  var need = rw.dailyMinPlays;
  var today = todayTw();
  var d = (S.acc && S.acc.daily && S.acc.daily.day === today) ? (S.acc.daily.plays || 0) : 0;
  var done = d >= need, left = Math.max(0, need - d), pct = need > 0 ? Math.min(100, d / need * 100) : 100;
  var rule = rw.dailyTopNeedsPlays ? '所有名次都必須達標' : '前三名免場數門檻，其他名次必須達標';
  return '<div class="daily-progress' + (done ? ' done' : '') + '"><div class="dp-top"><span>今日寶箱進度</span><b>' + d + ' / ' + need + ' 場</b></div>' +

function renderSlot(force) {

  h += '<div class="sec-h"><h2>賠率表</h2><span>理論回報約 94%</span></div><div class="grp pay-t">' +
    SLOT_PAY.map(function (x) { return '<div class="row"><span class="k">' + symHTML(x[0]) + symHTML(x[0]) + symHTML(x[0]) + '</span><span class="v">' + x[1] + ' 倍</span></div>'; }).join('') +

  if (put('vSlot', h, force)) {
    var root = $('vSlot'); bindBack(root);
    root.querySelectorAll('[data-slb]').forEach(function (b) { b.onclick = function () { if (!SL.spinning) { SL.bet = +b.getAttribute('data-slb'); renderSlot(true); } }; });
    var go = $('slotGo');
    if (go) go.onclick = function () { spinSlot(bet); };
  }

function spinSlot(bet) {
  if (SL.spinning) return;
  if (S.acc && S.acc.wallet < bet) { toast('錢包不夠', 'bad'); return; }
  SL.spinning = true;
  var go = $('slotGo'); if (go) go.disabled = true;
  var ids = Object.keys(SLOT_SYM), t0 = Date.now();
  [0, 1, 2].forEach(function (i) {
    var strip = document.querySelector('#reel' + i + ' .strip'), h = '';
    for (var k = 0; k < 18; k++) h += symHTML(ids[(k * 3 + i * 5) % ids.length]);
    strip.innerHTML = h; strip.parentNode.classList.add('spin');
  });
  $('slotMsg').textContent = '轉動中…';
  call('slotSpin', { bet: bet }).then(function (r) {
    var wait = Math.max(0, 700 - (Date.now() - t0));
    [0, 1, 2].forEach(function (i) {
      setTimeout(function () {
        var reel = $('reel' + i); if (!reel) return;
        reel.classList.remove('spin');
        reel.querySelector('.strip').innerHTML = symHTML(r.reels[i]);
        reel.classList.add('stop'); setTimeout(function () { reel.classList.remove('stop'); }, 400);
        if (i === 2) {
          SL.reels = r.reels; SL.last = r; SL.spinning = false;
          var msg = $('slotMsg');
          if (msg) msg.innerHTML = r.win > 0 ? '贏得 <b>' + fmt(r.win) + '</b>' + (r.mult >= 5 ? '　' + r.mult + ' 倍！' : '') : '沒中，再試一次';
          var m = document.querySelector('.slot-mach'); if (m && r.mult >= 5) { m.classList.remove('big'); void m.offsetWidth; m.classList.add('big'); }
          setTimeout(function () { if (S.tab === 'slot') renderSlot(true); }, 900);
        }
      }, wait + i * 380);
    });
  }).catch(function (e) {
    SL.spinning = false; toast(e.message, 'bad'); renderSlot(true);
  });
}

        DC.rolling = true; DC.last = null; renderDice(true);

        }).catch(function (e) { DC.rolling = false; toast(e.message, 'bad'); renderDice(true); });

}

    S.me.role = S.player.role;
    paintTop();
    render();
  }, function () {}));

  S.unsubs.push(db.collection('config').doc('catalog').onSnapshot(function (d) {
    rebuildItems(d.exists ? d.data() : null);
    render(true);
  }, function () {}));
  S.unsubs.push(db.collection('config').doc('highlights').onSnapshot(function (d) {
    HIGHLIGHTS = d.exists && Array.isArray(d.data().events) ? d.data().events.slice(0, 30) : [];
  }, function () {}));
  /* 全服信與自己的個人信分開查，避免其他玩家的排行獎勵把自己的信擠出最新 20 封。 */
  S.unsubs.push(db.collection('mail').where('all', '==', true).orderBy('at', 'desc').limit(20).onSnapshot(function (q) {
    var list = [];

    MAIL.broadcast = list;
    mergeMailLists();
  }, function () {}));
  S.unsubs.push(db.collection('mail').where('toList', 'array-contains', profile.pid).orderBy('at', 'desc').limit(50).onSnapshot(function (q) {
    var list = [];
    q.forEach(function (d) { list.push(d.data()); });
    MAIL.personal = list;
    mergeMailLists();
  }, function () {}));
  S.unsubs.push(db.collection('players').doc(profile.pid).collection('mailClaims').onSnapshot(function (q) {
    var m = {};
    q.forEach(function (d) { m[d.id] = true; });
    MAIL.claimed = m;
    paintMailBadge();
  }, function () {}));
  S.unsubs.push(db.collection('config').doc('app').onSnapshot(function (d) {
    S.cfg = d.exists ? d.data() : null;
    paintAnnounce();
    if (S.tab === 'rank' && RK.tab === 'last') loadLastSeason();

  }, function () {}));

  refreshPlayers(true);
  openSeason();

  clearInterval(S.tick);

    if (!S.me) return;

    if (S.tab === 'poker') { paintPokerClock(); paintBubbles(); }

/* 訂閱本季帳戶。跨季（週一 00:00）時會自動重新訂閱 */
function openSeason() {
  if (S.seasonUnsub) { try { S.seasonUnsub(); } catch (e) {} }
  if (S.seasonDocUnsub) { try { S.seasonDocUnsub(); } catch (e) {} }
  S.sid = sidOf(Date.now());
  if (TASKS.sid !== S.sid) {
    TASKS.data = null;
    TASKS.loading = false;
    TASKS.error = null;
    TASKS.sid = null;
  }
  S.accounts = [];
  S.acc = null;
  var sid = S.sid;
  call('econAccount').then(function (r) {
    if (S.sid !== sid || !S.me) return;
    if (!S.acc && r && r.account) { S.acc = r.account; render(); }
  }).catch(function (e) { if (S.me) toast(e.message, 'bad'); });

  S.season = null;
  S.seasonDocUnsub = db.collection('seasons').doc(sid).onSnapshot(function (d) {
    if (S.sid !== sid) return;
    S.season = d.exists ? d.data() : null;
    render();
  }, function () {});
  S.accountsAt = 0;
  liveOff('accounts:');
  S.seasonUnsub = db.collection('seasons').doc(sid).collection('accounts').doc(S.me.pid).onSnapshot(function (d) {
    if (S.sid !== sid || !d.exists) return;
    S.acc = d.data();
    var found = false;
    var roster = S.accountRoster.filter(function (a) { return a.pid !== S.acc.pid; });
    roster.push(S.acc);
    mergeAccounts(roster);
    render();
  }, function () {});
  syncLive();
}

function endSession() {
  liveOff();
  S.unsubs.splice(0).forEach(function (u) { try { u(); } catch (e) {} });
  if (S.seasonUnsub) { try { S.seasonUnsub(); } catch (e) {} S.seasonUnsub = null; }
  if (S.seasonDocUnsub) { try { S.seasonDocUnsub(); } catch (e) {} S.seasonDocUnsub = null; }
  S.players = {}; S.season = null; S.accountRoster = []; RK.last = null; RK.lastSid = null; RK.tab = 'now';
  TASKS.data = null; TASKS.loading = false; TASKS.error = null; TASKS.sid = null;
  clearInterval(S.tick);
  S.me = null; S.player = null; S.cfg = null; S.roster = [];
  S.acc = null; S.accounts = []; S.sid = null; S.tab = 'home'; S.meTab = 'acct';
  PK.st = null; PK.hole = null; PK.synced = false; PK.fx = { pendingDeal: 0, pendingBets: null, pendingPayout: null, paidHand: 0 };
  BJ.st = null; B2.tableId = 'main'; B2.st = null; B2.hand = null; B2.selected = {}; S.playersAt = 0; S.accountsAt = 0; closeRaise();
  MAIL.list = []; MAIL.broadcast = []; MAIL.personal = []; MAIL.claimed = {}; HIGHLIGHTS = []; $('announce').hidden = true;

}

function paintSeason() {
  var box = $('seasonBox');
  if (!box) return;
  var now = Date.now(), r = seasonRange(now);
  var left = Math.max(0, r.end - now);
  var d = Math.floor(left / DAY), hh = Math.floor(left % DAY / 3600000), mm = Math.floor(left % 3600000 / 60000);
  var cd = d > 0 ? d + ' 天 ' + hh + ' 小時' : hh + ' 小時 ' + mm + ' 分';
  var pctW = Math.min(100, (now - r.start) / (7 * DAY) * 100);
  var html = '<div class="asset-foot"><span>距離結算 <b>' + cd + '</b></span>' +
    '<span>第 ' + isoWeek(now) + ' 週　' + twDate(r.start) + ' – ' + twDate(r.end - 1) + '</span></div>' +
    '<div class="track"><i style="width:' + pctW.toFixed(2) + '%"></i></div>';
  if (box.innerHTML !== html) box.innerHTML = html;
}

function paintVaultClock() {
  var el = $('vaultClock'), a = S.acc;
  if (!el || !a) return;
  var now = Date.now(), P = periodStart(now), next = P + PERIOD;
  var rk = rankTable()[a.pid] || { rate: econ().interestMin };
  var rate = rk.rate + dexInterestOf(S.player).total;
  var base = a.bank.periodKey >= P ? a.bank.periodMin : a.bank.balance;
  var est = Math.floor(Math.max(0, base) * rate);
  var d = new Date(next + TW);
  var html = '<div><small>下次計息 ' + String(d.getUTCHours()).padStart(2, '0') + ':00</small>' +
    '<div class="cd">' + hms(next - now) + '</div></div>' +
    '<div><small>預估利息</small><div class="est">+' + fmt(est) + '</div></div>';
  if (el.innerHTML !== html) el.innerHTML = html;
}

/* =====================================================================
   底部面板
   ===================================================================== */
function openSheet(html, onReady) {
  var bg = $('sheetBg'), sh = $('sheet');
  sh.className = 'sheet';
  sh.innerHTML = '<div class="sheet-grip"></div>' + html;
  bg.hidden = false; sh.hidden = false;
  requestAnimationFrame(function () { bg.classList.add('on'); sh.classList.add('on'); });
  if (onReady) onReady(sh);
  var first = sh.querySelector('input');
  if (first) setTimeout(function () { first.focus(); }, 280);
}

function closeSheet() {
  var bg = $('sheetBg'), sh = $('sheet');
  if (sh.hidden) return;
  bg.classList.remove('on'); sh.classList.remove('on');
  setTimeout(function () { if (!sh.classList.contains('on')) { bg.hidden = true; sh.hidden = true; sh.innerHTML = ''; } }, 260);
}

$('sheetBg').addEventListener('click', closeSheet);
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

function acts(primary, kind) {
  return '<div class="acts"><button class="btn ghost" type="button" data-close>取消</button>' +
    '<button class="btn' + (kind ? ' ' + kind : '') + '" type="submit">' + primary + '</button></div>';
}

/* 表單型面板：submit 回傳 Promise，成功就關閉 */
function formSheet(title, desc, fields, primary, kind, submit) {
  var h = '<form novalidate><h3>' + title + '</h3>' + (desc ? '<p class="desc">' + desc + '</p>' : '') + fields + acts(primary, kind) + '</form>';
  openSheet(h, function (sh) {
    var form = sh.querySelector('form'), btn = form.querySelector('[type=submit]');
    form.querySelector('[data-close]').onclick = closeSheet;
    form.onsubmit = function (ev) {
      ev.preventDefault();
      if (btn.disabled) return;
      var p = submit(form);
      if (!p) return;
      busy(btn, true);
      p.then(function (msg) {
        busy(btn, false);
        closeSheet();
        if (msg) toast(msg, 'good');
      }, function (e) {
        busy(btn, false);
        if (e && e.message) toast(e.message, 'bad');
      });
    };
  });
}

function fld(id, label, type, extra) {
  return '<div class="fld"><label for="' + id + '">' + label + '</label><input id="' + id + '" type="' + (type || 'text') + '"' + (extra || '') + '></div>';
}

      '<button class="row" data-p="revoke"><span class="k">收回物品<small>誤發或退款時使用</small></span><span class="chev">›</span></button>' +
      (self ? '' : '<button class="row" data-p="role"><span class="k">' + (p.role === 'admin' ? '取消管理員' : '設為管理員') + '<small>管理員擁有全部後台權限</small></span><span class="chev">›</span></button>') +
      (PK.st && PK.st.seats.some(function (x) { return x && x.pid === pid; }) ? '<button class="row red" data-p="kick"><span class="k">請離牌桌<small>牌局中會先蓋牌，打完帶回錢包</small></span></button>' : '') +
      '<button class="row" data-p="ledger"><span class="k">流水帳<small>本季最近 40 筆，只有管理員看得到</small></span><span class="chev">›</span></button>' +
      '<button class="row" data-p="rename"><span class="k">改名</span><span class="chev">›</span></button>' +
      (self ? '' : '<button class="row red" data-p="reset"><span class="k">重設密碼<small>他的登入會失效，下次進來要重新設密碼</small></span></button>') +
    '</div>' +
    '<div class="acts" style="margin-top:14px"><button class="btn ghost" type="button" data-close>關閉</button></div>';
  openSheet(h, function (sh) {
    sh.querySelector('[data-close]').onclick = closeSheet;
    sh.querySelector('[data-p=adjust]').onclick = function () { sheetAdjust(p); };
    sh.querySelector('[data-p=ledger]').onclick = function () { sheetLedger(p); };
    sh.querySelector('[data-p=grant]').onclick = function () { sheetGrant(S.players[p.pid] || p); };
    sh.querySelector('[data-p=revoke]').onclick = function () { sheetRevoke(S.players[p.pid] || p); };
    var rl = sh.querySelector('[data-p=role]');
    if (rl) rl.onclick = function () {
      var to = p.role === 'admin' ? 'player' : 'admin';
      formSheet(to === 'admin' ? '把 ' + esc(p.name) + ' 設為管理員？' : '取消 ' + esc(p.name) + ' 的管理員？',
        to === 'admin' ? '他會擁有全部後台權限，包含改資產、發物品、結算。' : '他會變回一般玩家。', '', '確定', to === 'admin' ? 'danger' : '', function () {
          return call('adminSetRole', { pid: p.pid, role: to }).then(function () { return '已更新權限，他重新整理後生效'; });
        });
    };
    var kk = sh.querySelector('[data-p=kick]');
    if (kk) kk.onclick = function () {
      formSheet('請 ' + esc(p.name) + ' 離開牌桌？', '牌局中會先幫他蓋牌，打完這手把籌碼帶回錢包。', '', '請離', 'danger', function () {
        return pcall('adminPokerKick', { pid: p.pid }).then(function (r) { return r.later ? '這手結束後帶離' : '已請離牌桌'; });
      });
    };
    sh.querySelector('[data-p=rename]').onclick = function () { sheetRename(p); };
    var r = sh.querySelector('[data-p=reset]');
    if (r) r.onclick = function () { sheetReset(p); };
  });
}

/* 金額輸入：只留數字，旁邊可放快捷按鈕 */
function amountField(id, label, quick, limitText) {
  var q = (quick || []).map(function (x) {
    return '<button type="button" data-q="' + x.v + '">' + x.t + '</button>';
  }).join('');
  return '<div class="fld"><label for="' + id + '">' + label + '</label>' +
    '<input id="' + id + '" class="amt-in" inputmode="numeric" autocomplete="off" placeholder="0"></div>' +
    (limitText ? '<p class="limit">' + limitText + '</p>' : '') +
    (q ? '<div class="quick">' + q + '</div>' : '');
}

function bindAmount(id, sign) {
  var el = $(id);
  if (!el) return;
  el.addEventListener('input', function () {
    var neg = sign && /^\s*-/.test(el.value);
    var digits = el.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, 9);
    el.value = (neg ? '-' : '') + digits;
  });
  document.querySelectorAll('#sheet [data-q]').forEach(function (b) {
    b.onclick = function () { el.value = b.getAttribute('data-q'); el.focus(); };
  });
}

/* 快捷金額：只列出比上限小的固定金額，最後一顆是「全部」 */
function quickAmounts(fixed, max, allText) {
  if (max <= 0) return [];
  var out = fixed.filter(function (v) { return v < max; }).map(function (v) { return { v: v, t: fmt(v) }; });
  out.push({ v: max, t: allText });
  return out;
}

function readAmount(id) {
  var v = $(id).value.trim();
  return /^-?\d+$/.test(v) ? parseInt(v, 10) : NaN;
}

function sheetDeposit() {
  var a = S.acc, c = econ(), max = maxDeposit(a, c);
  var quick = quickAmounts([1000, 5000], max, '全部可存');
  formSheet('存款', '', amountField('sAmt', '存入金額', quick, '錢包 ' + fmt(a.wallet) + '，最多可存 ' + fmt(max)),
    '存入銀行', '', function () {
      var n = readAmount('sAmt');
      if (!(n > 0)) { toast('要輸入金額', 'bad'); return null; }
      if (n > max) { toast('最多只能存 ' + fmt(max), 'bad'); return null; }
      return call('econDeposit', { amount: n }).then(function () { return '已存入 ' + fmt(n); });
    });
  bindAmount('sAmt');
}

function sheetWithdraw() {
  var a = S.acc, bal = a.bank.balance;
  var quick = quickAmounts([1000, 5000], bal, '全部');
  formSheet('提款', '領出來的錢會回到錢包。', amountField('sAmt', '提款金額', quick, '銀行裡有 ' + fmt(bal)),
    '領出', '', function () {
      var n = readAmount('sAmt');
      if (!(n > 0)) { toast('要輸入金額', 'bad'); return null; }
      if (n > bal) { toast('銀行裡只有 ' + fmt(bal), 'bad'); return null; }
      return call('econWithdraw', { amount: n }).then(function () { return '已領出 ' + fmt(n); });
    });
  bindAmount('sAmt');
}

function sheetBorrow() {
  var c = econ(), a = S.acc;
  formSheet('借 ' + fmt(c.loanUnit) + '？',
    '不計利息。錢包達到 ' + fmt(c.loanRepayAt) + ' 時，系統會自動還一筆 ' + fmt(c.loanUnit) + '。' +
    (a.loans ? '借完之後總共欠 ' + fmt((a.loans + 1) * c.loanUnit) + '。' : ''),
    '', '借款', 'danger', function () {
      return call('econBorrow').then(function () { return '已借 ' + fmt(c.loanUnit); });
    });
}

function sheetAdjust(p) {
  var ac = accOf(p.pid);
  formSheet('調整 ' + esc(p.name) + ' 的資產',
    '正數是增加，負數是扣除（例如 -500）。' + (ac ? '目前錢包 ' + fmt(ac.wallet) + '。' : ''),
    amountField('sAmt', '金額', [{ v: 500, t: '+500' }, { v: 2000, t: '+2,000' }, { v: -500, t: '-500' }]) +
    fld('sNote', '備註（選填）', 'text', ' maxlength="60" autocomplete="off" placeholder="例如：活動獎勵"'),
    '確認調整', '', function () {
      var n = readAmount('sAmt');
      if (!n) { toast('要輸入非零的金額', 'bad'); return null; }
      return call('adminAdjust', { pid: p.pid, delta: n, note: $('sNote').value.trim() })
        .then(function () { return (n > 0 ? '已增加 ' : '已扣除 ') + fmt(Math.abs(n)); });
    });
  bindAmount('sAmt', true);
}

var LEDGER_TXT = {
  start: '起始資金', borrow: '借款', repay: '自動還款', deposit: '存入銀行', withdraw: '從銀行領出',
  daily: '每日獎勵', admin: '管理員調整', interest: '利息',
  buyIn: '帶入牌桌', cashOut: '離桌帶回', rebuy: '補碼', mail: '信箱領取', game: '小遊戲'
};

function sheetLedger(p) {
  openSheet('<h3>' + esc(p.name) + ' 的流水帳</h3><p class="desc">本季最近 40 筆</p>' +
    '<div class="grp led" id="ledBox"><div class="empty">讀取中…</div></div>' +
    '<div class="acts" style="margin-top:14px"><button class="btn ghost" type="button" data-close>關閉</button></div>',
    function (sh) {
      sh.querySelector('[data-close]').onclick = closeSheet;
      call('adminLedger', { pid: p.pid }).then(function (r) {
        var box = $('ledBox');
        if (!box) return;
        if (!r.rows.length) { box.innerHTML = '<div class="empty">本季還沒有紀錄</div>'; return; }
        box.innerHTML = r.rows.map(function (x) {
          var label = LEDGER_TXT[x.type] || x.type;
          if (x.type === 'interest' && x.rank) label += '（第 ' + x.rank + ' 名 ' + pct(x.rate) + '）';
          var sub = twClock(x.at) + (x.note ? '　' + esc(x.note) : '') + (x.by && x.by !== p.pid && x.by !== 'system' ? '　by #' + esc(x.by) : '');
          var bankMove = ['deposit', 'withdraw', 'buyIn', 'cashOut', 'rebuy'].indexOf(x.type) >= 0;
          return '<div class="row"><span class="k">' + label + '<small>' + sub + '</small></span>' +
            '<span class="amt ' + (bankMove ? 'mv' : x.amount >= 0 ? 'up' : 'dn') + '">' +
            (x.amount > 0 ? '+' : '') + fmt(x.amount) + '<small>錢包 ' + fmt(x.wallet) + '</small></span></div>';
        }).join('');
      }).catch(function (e) {
        var box = $('ledBox');
        if (box) box.innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
      });
    });
}

function sheetEcon() {
  var c = econ();
  function num(id, label, v, help) {
    return '<div class="fld"><label for="' + id + '">' + label + '</label><input id="' + id + '" inputmode="decimal" autocomplete="off" value="' + v + '">' +
      (help ? '<div class="help">' + help + '</div>' : '') + '</div>';
  }
  var pv = function (x) { return String(Math.round(x * 100000) / 1000); };
  formSheet('經濟設定', '改完立刻生效。起始資金只影響之後新建的帳戶。',
    '<div class="fld-grid">' +
      num('eStart', '每季起始資金', c.startingMoney) +
      num('eKeep', '存款後手上至少留', c.bankKeep) +
      num('eUnit', '每筆借款', c.loanUnit) +
      num('eRepay', '自動還款門檻', c.loanRepayAt) +
      num('eBelow', '低於多少可以借', c.borrowBelow) +
      num('eRank', '計入排名最少手數', c.rankMinHands) +
      num('sPer', '每多少資產換 1 星幣', c.starPer, '無條件進位') +
      num('sCap', '一季最多星幣', c.starCap, '0 = 不限') +
      num('sMinH', '換星幣最少手數', c.starMinHands) +
      num('eMin', '第一名利率 %', pv(c.interestMin), '每 3 小時') +
      num('eMax', '最後一名利率 %', pv(c.interestMax), '每 3 小時') +
    '</div>',
    '儲存設定', '', function () {
      var ints = { eStart: 'startingMoney', eKeep: 'bankKeep', eUnit: 'loanUnit', eRepay: 'loanRepayAt', eBelow: 'borrowBelow', eRank: 'rankMinHands', sPer: 'starPer', sCap: 'starCap', sMinH: 'starMinHands' };
      var patch = {}, bad = null;
      Object.keys(ints).forEach(function (id) {
        var v = $(id).value.trim();
        if (!/^\d+$/.test(v)) bad = bad || id; else patch[ints[id]] = parseInt(v, 10);
      });
      ['eMin', 'eMax'].forEach(function (id) {
        var v = $(id).value.trim();
        if (!/^\d*\.?\d+$/.test(v)) bad = bad || id; else patch[id === 'eMin' ? 'interestMin' : 'interestMax'] = parseFloat(v) / 100;
      });
      if (bad) { toast('數字格式不對', 'bad'); $(bad).focus(); return null; }
      if (patch.interestMin > patch.interestMax) { toast('第一名利率不能比最後一名高', 'bad'); return null; }
      return call('adminSetEcon', patch).then(function () { return '設定已儲存'; });
    });
}

function sheetInterest() {
  formSheet('補算利息', '結算上一個 3 小時時段的利息。排程已經算過的話不會重複發放。', '', '補算', '', function () {
    return call('adminRunInterest').then(function (r) {
      if (r.skipped) return '這個時段已經算過了';
      return r.total > 0 ? '已發放利息 ' + fmt(r.total) + '（' + r.count + ' 人）' : '已結算，這個時段沒有利息可發';
    });
  });
}

function sheetRename(p) {
  formSheet('改名', '#' + esc(p.pid) + ' 目前叫「' + esc(p.name) + '」。',
    fld('sRename', '新名字', 'text', ' maxlength="12" autocomplete="off" value="' + esc(p.name) + '"'),
    '改名', '', function () {
      var name = $('sRename').value.trim();
      if (!name) { toast('要填名字', 'bad'); return null; }
      if (name === p.name) { closeSheet(); return null; }
      return call('adminRenamePlayer', { pid: p.pid, name: name }).then(function () { return '已改名為 ' + name; });
    });
}

function sheetReset(p) {
  formSheet('重設 ' + esc(p.name) + ' 的密碼？', '他目前的登入會立刻失效，下次輸入 #' + esc(p.pid) + ' 時要重新設定密碼。', '',
    '重設密碼', 'danger', function () {
      return call('adminResetPassword', { pid: p.pid }).then(function () { return '已重設，請他重新設定密碼'; });
    });
}

})();
</script>
